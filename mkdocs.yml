---
site_name: "Common Data Model"
theme:
  name: material
  custom_dir: src/docs/overrides
  # Altium look shared with the Altium 365 API reference: wordmark, self-hosted Inter / JetBrains Mono (custom.css),
  # Altium blue on a black header, light and dark schemes
  logo: img/altium-logo.svg
  favicon: img/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - content.tabs.link
    - content.tooltips
    - navigation.top
    # No navigation.instant: it swaps page content without a reload, and the class diagrams (mermaid2, ELK layout)
    # render only on a full page load
    - navigation.sections
    - navigation.indexes
  icon:
    tag:
      experimental: fontawesome/solid/flask
      obsolete: fontawesome/regular/hand
plugins:
  - tags
  - search
  - mknotebooks:
      execute: false
  - mermaid2:
      version: 10.9.0
# Publishes llms.txt, llms-ctx.txt, llms-full.txt and llms/ (cdm-gen-llms) with the site
hooks:
  - src/docs/hooks/llms.py
  # Makes every bounded context in the sidebar expandable, listing its classes
  - src/docs/hooks/nav.py
# Inputs of the llms files besides docs/, rebuilt by mkdocs serve when they change
watch:
  - src/common_data_model/schema
  - src/docs/links
  - src/docs/api
nav:
  - Overview: index.md
  - About: about.md
  - GRIDs: grid-format.md
  - Concepts:
      - Domain Model: domain-model.md
      - Entity Classification: entity-classification.md
      - Relation Types: relation-types.md
  # Every subset page, in the Altium 365 API reference order; titles come from the subset `title`
  # (tests/cdm_tools/test_bc_styles.py checks that every subset is listed)
  - Bounded Contexts:
      - subsets/platform.md
      - subsets/design.md
      - subsets/insights.md
      - subsets/library.md
      - subsets/collaboration.md
      - subsets/configuration.md
      - subsets/procurement.md
      - subsets/supply.md
      - subsets/customization.md
      - subsets/system.md
      - subsets/system-sdm.md
      - subsets/requirements.md
      - subsets/deviceModel.md
      - subsets/software.md
      - subsets/ota.md
      - subsets/core.md
  - Reference:
      - Glossary: glossary.md
      - Tags: tags.md
# Not pages of the site: snippet sources included into top-level pages with --8<--, and the reference
# and coverage pages, which cdm-gen-reference generates for internal use
exclude_docs: |
  _snippets/
  /reference/
  /coverage.md
site_url: https://w3id.org/altium/cdm/
repo_url: https://github.com/AltiumDeveloper/cdm
markdown_extensions:
  - tables
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        # Class cdm-diagram, not mermaid: Material renders .mermaid elements itself (closed shadow DOM, its own theme);
        # javascript/mermaid.mjs renders these with the site's look
        - name: mermaid
          class: cdm-diagram
          format: !!python/name:mermaid2.fence_mermaid_custom
copyright: Copyright &copy; Altium
extra:
  generator: false
  # Header (src/docs/overrides/partials/header.html): one title block and links to the sibling sites
  header_title: Common Data Model - Reference Documentation
  header_links:
    - label: Altium 365 API
      href: https://altiumdeveloper.github.io/platform-api-docs/
    - label: Developer Center
      href: https://developer.altium.com/
    - label: GitHub
      href: https://github.com/AltiumDeveloper/cdm
  tags:
    experimental: experimental
    obsolete: obsolete
  # Base of the absolute links in llms.txt, llms-ctx.txt and llms-full.txt. The site is served here; w3id.org/altium/cdm/
  # (site_url) redirects only the root to it today, not paths such as about/ or llms.txt (MF-076).
  llms_base_url: https://altiumdeveloper.github.io/cdm/
extra_css:
  - css/custom.css
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascript/tablesort.js
  - javascript/copy.js
  - javascript/mermaid.mjs

# Uncomment this block to enable use of Google Analytics.
# Replace the property value with your own ID.
# extra:
#   analytics:
#     provider: google
#     property: G-XXXXXXXXXX
