id: https://w3id.org/altium/cdm/supply/
name: cdm-supply

prefixes:
  linkml: https://w3id.org/linkml/
  sup: https://w3id.org/altium/cdm/supply/

imports:
  - linkml:types

default_range: string
default_prefix: sup

subsets:
  supply:
    title: Supply
    description: >-
      Models the supply catalog: manufacturer parts with their aggregated sourcing data and distributor
      offers, the companies acting as their manufacturers or distributors, and the vendor-specific part family
      hierarchy, along with catalog content such as reference designs, evaluation kits, solution templates and
      software projects. Part, offer and company data correspond to the supply chain data that Octopart
      aggregates and serves through the Octopart API.
    see_also:
      - https://www.altium.com/documentation/altium-developer-center/octopart
      - https://www.altium.com/documentation/altium-developer-center/octopart/api
      - https://www.altium.com/documentation/altium-designer/components-libraries/adding-supply-chain-information-component
    annotations:
      style: "fill:#0c559c"

classes:

  sup_Part:
    is_a: core_Artifact
    in_subset: supply 
    class_uri: sup:Part
    title: Part
    description: >-
      Supply Part represents a market-available instance of a manufactured Part, 
      providing aggregated sourcing data such as pricing, stock levels, and supplier offers.
    comments:
      - Each Supply Part has its own identity derived from manufacturer and supplier metadata, and may correspond to multiple suppliers’ listings.  
      - It bridges the design and supply chain domains by enriching managed Parts with real-time market intelligence, 
        enabling informed sourcing, alternates evaluation, and procurement optimization within Altium 365.
    annotations:
      grid: grid:supply::platform:part/{id}
      nexarAPI: SupPart
    see_also:
      - https://www.altium.com/documentation/altium-designer/components-libraries/searching-manufacturer-parts#manufacturer_and_supplier_data
      - https://www.altium.com/documentation/altium-developer-center/octopart/api
    structured_aliases:
      - literal_form: Manufacturer Part
        predicate: RELATED_SYNONYM
        contexts: [altium-designer]
        source: https://www.altium.com/documentation/altium-designer/components-libraries/searching-manufacturer-parts
    attributes:
      sup_Part_mpn:
        alias: mpn
        slot_uri: sup:Part_mpn
        title: mpn
        description: TBD
        range: string
        required: true
        multivalued: false
      sup_Part_manufacturer:
        alias: manufacturer
        slot_uri: sup:Part_manufacturer
        title: manufacturer
        description: The company that manufactures this part.
        range: sup_Company
        required: true
        multivalued: false        
      sup_Part_referenceDesigns:
        alias: referenceDesigns
        slot_uri: sup:Part_referenceDesigns
        title: reference designs
        description: Reference designs that use this part.
        range: sup_ReferenceDesign
        multivalued: true
        required: false

  sup_Offer:
    is_a: core_Artifact
    in_subset: supply
    class_uri: sup:Offer
    title: Offer
    description: >-
      Supply Offer represents a specific commercial listing of a Part from a supplier, 
      detailing price breaks, stock availability, lead times, and ordering conditions at a given point in time.
    comments:
      - Each Supply Offer has its own identity and is associated with a Supply Part, reflecting one supplier’s current market position.  
      - It enables designers and procurement teams to evaluate sourcing options dynamically, supporting cost optimization, 
        risk mitigation, and automated supply validation within the Altium 365 and Octopart ecosystems.
    annotations:
      grid: grid:supply::platform:part/{id}/offer/{offerID}
      nexarAPI: SupOffer
    see_also:
      - https://www.altium.com/documentation/altium-365/bom-portal/sourced-manufacturer-supplier-data#order_list
      - https://www.altium.com/documentation/altium-developer-center/octopart/api
    structured_aliases:
      - literal_form: Supplier Part
        predicate: RELATED_SYNONYM
        contexts: [altium-designer]
        source: https://www.altium.com/documentation/altium-designer/components-libraries/adding-supply-chain-information-component

  sup_Company:
    is_a: core_Artifact
    in_subset: supply
    class_uri: sup:Company
    title: Company
    description: >-
      Supply Company represents an organization in the electronics supply chain. Depending on context it is
      the manufacturer of a Part or a distributor (or broker) that sells it.
    comments:
      - Each Supply Company has its own identity and metadata, including contact, regional, and certification details.  
      - It serves as the authoritative entity behind Supply Offers, enabling traceability, supplier qualification, 
        and integration of trusted sourcing data across Octopart and Altium 365 workflows.
    annotations:
      grid: grid:supply::platform:company/{id}
      nexarAPI: SupCompany

  sup_PartFamily:
    is_a: core_Artifact
    in_subset: supply
    class_uri: sup:PartFamily
    title: Part Family
    description: >-
      A manufacturer's grouping of parts in the supply data, where the kind of family is vendor-specific
      (e.g. Series or Family). Part families form a hierarchy: a family has either child families or, at the
      lowest level, Part Groups. Families sharing the same parent are usually close alternatives to one another.
    attributes:
      sup_PartFamily_partGroups:
        alias: partGroups
        slot_uri: sup:PartFamily_partGroups
        title: part groups
        description: Part groups belonging to this part family.
        range: sup_PartGroup
        multivalued: true
        required: false
      sup_PartFamily_alternatives:
        alias: alternatives
        slot_uri: sup:PartFamily_alternatives
        title: alternatives
        description: Alternative part families that can substitute this one.
        range: sup_PartFamily
        multivalued: true
        required: false
    annotations:
      grid: grid:supply::platform:part-family/{id}
      platformAPI: SupPartFamily

  sup_PartGroup:
    is_a: core_Artifact
    in_subset: supply
    class_uri: sup:PartGroup
    title: Part Group
    description: >-
      A leaf of the part family hierarchy in the supply data, holding the parts that belong to it together
      with group-level information such as its manufacturer, overview, key features and documents. Groups sharing the same parent family are usually close alternatives to one another.
    annotations:
      grid: grid:supply::platform:part-group/{id}
      platformAPI: SupPartGroup
    attributes:
      sup_PartGroup_parts:
        alias: parts
        slot_uri: sup:PartGroup_parts
        title: parts
        description: Parts belonging to this part group.
        range: sup_Part
        multivalued: true
        required: false
      sup_PartGroup_alternatives:
        alias: alternatives
        slot_uri: sup:PartGroup_alternatives
        title: alternatives
        description: Alternative part groups that can substitute this one.
        range: sup_PartGroup
        multivalued: true
        required: false

  sup_ReferenceDesign:
    is_a: core_Artifact
    in_subset: supply
    class_uri: sup:ReferenceDesign
    title: Reference Design
    description: >-
      An example design published in the supply catalog, bringing together its design files (e.g. schematics
      and layouts), documentation and the parts it uses. In Renesas 365 a reference design can be imported into
      a solution, which adds it to the Workspace as a PCB project linked to that solution.
    annotations:
      grid: grid:supply::platform:ref-design/{id}
      platformAPI: SupRefDesign
    see_also:
      - https://www.altium.com/documentation/altium-365/renesas-365#import_project

  sup_SolutionTemplate:
    is_a: core_Artifact
    in_subset: supply
    class_uri: sup:SolutionTemplate
    title: Solution Template
    description: >-
      A publisher's template for a solution, held in the supply catalog. It brings together catalog software
      projects, evaluation kits and a system design (ESD) source, and users can clone it.
    aliases:
      - Reference Solution (obsolete)
    slots:
      - sup_eval_kits
    annotations:
      grid: grid:supply::platform:solution-template/{id}
      platformAPI: SupSolutionTemplate
    attributes:
      sup_SolutionTemplate_softwareProjects:
        is_a: core_hasPart
        slot_uri: sup:SolutionTemplate_softwareProjects
        alias: softwareProjects
        title: software projects
        description: Software Projects included in this Artifact
        range: sup_SoftwareProject
        required: false
        multivalued: true

  sup_SoftwareProject:
    is_a: core_Artifact
    in_subset: supply
    class_uri: sup:SoftwareProject
    title: Software Project
    description: >-
      A software project published in the supply catalog, together with the evaluation kits it is compatible
      with. In Renesas 365 it can be imported into a solution with a compatible eval kit; the import places the
      project in the Workspace and links it to the solution (see sft_SoftwareProject).
    slots:
      - sup_eval_kits
    annotations:
      grid: grid:supply::platform:software-project/{id}
      platformAPI: SupSoftwareProject
    see_also:
      - https://www.altium.com/documentation/altium-365/renesas-365#import_project

  sup_EvalKit:
    is_a: core_Artifact
    in_subset: supply
    class_uri: sup:EvalKit
    title: Evaluation Kit
    description: >-
      A vendor evaluation kit in the supply catalog, described by its associated devices, its reference designs
      (including a main one) and the software projects compatible with it. In Renesas 365 an eval kit can be
      linked to a solution, and the browser can connect to the kit over J-Link.
    annotations:
      grid: grid:supply::platform:eval-kit/{id}
      platformAPI: SupEvalKit
    see_also:
      - https://www.altium.com/documentation/altium-365/renesas-365#linking_an_evaluation_kit
    structured_aliases:
      - literal_form: Eval Kit
        predicate: EXACT_SYNONYM
        contexts: [altium-365]
        source: https://www.altium.com/documentation/altium-365/renesas-365

slots:

  sup_eval_kits:
    is_a: core_hasPart
    slot_uri: sup:consists_of_eval_kits
    alias: evalKits
    title: evalKits
    description: Evaluation Kits included in this Artifact
    domain: core_Artifact
    range: sup_EvalKit
    required: false
    multivalued: true