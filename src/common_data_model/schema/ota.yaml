id: https://w3id.org/altium/cdm/ota/
name: cdm-ota
prefixes:
  linkml: https://w3id.org/linkml/
  core: https://w3id.org/altium/cdm/core/
  ota: https://w3id.org/altium/cdm/ota/
imports:
  - linkml:types

default_range: string
default_prefix: ota

subsets:
  ota:
    description: >-
      Models over-the-air (OTA) firmware and software updates: devices with their ECUs and the software
      each ECU reports, fleets that group devices, packages with their version, size, checksums and target
      hardware, and deployments that roll packages out to a device or fleet and record their results.
      All classes are experimental.
    annotations:
      style: "fill:#d29292"
      productDocs: none

enums:

  ota_DeviceStatus:
    is_a: Enumeration
    in_subset: ota
    enum_uri: ota:DeviceStatus
    description: The OTA update status of a device.
    implements:
      - owl:NamedIndividual
    permissible_values:
      NotSeen:
        description: The device has not connected to the platform yet.
      Error:
        description: The last update reported an error.
      UpToDate:
        description: The installed software matches the assigned software.
      UpdatePending:
        description: An update is assigned and waits to be delivered.
      Outdated:
        description: The installed software differs from the assigned software.
      UpdateScheduled:
        description: An update is scheduled for a future date and time.

  ota_DeploymentStatus:
    is_a: Enumeration
    in_subset: ota
    enum_uri: ota:DeploymentStatus
    description: >-
      The status of a deployment. Success or failure of a completed deployment is reported
      by isSuccessful on the device and component results.
    implements:
      - owl:NamedIndividual
    permissible_values:
      Pending:
        description: The deployment is created and not yet received by the device.
      Scheduled:
        description: The deployment is scheduled to start at a future date and time.
      InProgress:
        description: The device has received the update instructions and is installing.
      Completed:
        description: The deployment finished, either successfully or with a failure.
      Cancelled:
        description: The deployment was cancelled before it was received by the device.

  ota_PackageCategory:
    is_a: Enumeration
    in_subset: ota
    enum_uri: ota:PackageCategory
    description: The category of software installed on an ECU.
    implements:
      - owl:NamedIndividual
    permissible_values:
      Base:
        description: The base operating system.
      Bootloader:
        description: The bootloader.
      Applications:
        description: Application software.
      Other:
        description: Any other software.

classes:

  ota_Device:
    is_a: core_Artifact
    in_subset: ota
    class_uri: ota:Device
    title: Device
    description: >-
      Device represents a physical unit registered for OTA updates. A device consists of
      one primary ECU and optional secondary ECUs, and may belong to fleets.
    annotations:
      grid: grid:workspace:{workspace-id}:ota:device/{id}
      maturity: EXPERIMENTAL
    slots:
      - core_name
    attributes:
      ota_Device_deviceId:
        slot_uri: ota:Device_deviceId
        alias: deviceId
        title: deviceId
        description: The device-side identifier provided at provisioning.
        range: string
        multivalued: false
        required: true
      ota_Device_hardwareId:
        slot_uri: ota:Device_hardwareId
        alias: hardwareId
        title: hardwareId
        description: >-
          The hardware identifier of the device as reported by the source, when provided.
          It does not identify the primary ECU; use Ecu.isPrimary for that.
        range: string
        multivalued: false
        required: false
      ota_Device_status:
        slot_uri: ota:Device_status
        alias: status
        title: status
        description: Current device status
        range: ota_DeviceStatus
        multivalued: false
        required: true
      ota_Device_lastSeenAt:
        slot_uri: ota:Device_lastSeenAt
        alias: lastSeenAt
        title: lastSeenAt
        description: The date and time the device last connected, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Device_createdAt:
        slot_uri: ota:Device_createdAt
        alias: createdAt
        title: createdAt
        description: The date and time the device was registered, in UTC.
        range: datetime
        multivalued: false
        required: true
      ota_Device_activatedAt:
        slot_uri: ota:Device_activatedAt
        alias: activatedAt
        title: activatedAt
        description: The date and time the device first connected, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Device_lastUpdatedAt:
        slot_uri: ota:Device_lastUpdatedAt
        alias: lastUpdatedAt
        title: lastUpdatedAt
        description: The date and time the device was last updated, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Device_hibernated:
        slot_uri: ota:Device_hibernated
        alias: hibernated
        title: hibernated
        description: Indicates whether the device is hibernated and excluded from updates.
        range: boolean
        multivalued: false
        required: false
      ota_Device_networkInfo:
        slot_uri: ota:Device_networkInfo
        alias: networkInfo
        title: networkInfo
        description: The network information last reported by the device.
        range: ota_DeviceNetworkInfo
        multivalued: false
        required: false
        inlined: true
      ota_Device_notes:
        slot_uri: ota:Device_notes
        alias: notes
        title: notes
        description: Free-form notes associated with the device.
        range: string
        multivalued: false
        required: false
      ota_Device_tags:
        slot_uri: ota:Device_tags
        alias: tags
        title: tags
        description: Key-value tags of the device.
        range: ota_DeviceTag
        multivalued: true
        required: false
        inlined: true
        inlined_as_list: true
      ota_Device_ecus:
        slot_uri: ota:Device_ecus
        alias: ecus
        title: ecus
        description: >-
          The ECUs of the device, including the primary ECU. Providers typically return
          them from a separate components endpoint, so they may be absent from device listings.
        range: ota_Ecu
        multivalued: true
        required: false
        inlined: true
        inlined_as_list: true

  ota_DeviceTag:
    is_a: core_Resource
    in_subset: ota
    class_uri: ota:DeviceTag
    title: Device Tag
    description: >-
      Device Tag is a key-value pair attached to a device for organization and filtering.
    attributes:
      ota_DeviceTag_key:
        slot_uri: ota:DeviceTag_key
        alias: key
        title: key
        description: >-
          The tag key, unique per device. At most 20 ASCII letters, digits, underscores,
          or hyphens.
        range: string
        multivalued: false
        required: true
        identifier: true
      ota_DeviceTag_value:
        slot_uri: ota:DeviceTag_value
        alias: value
        title: value
        description: >-
          The tag value. At most 50 ASCII letters, digits, underscores, hyphens, slashes,
          or spaces.
        range: string
        multivalued: false
        required: true

  ota_DeviceNetworkInfo:
    is_a: core_Resource
    in_subset: ota
    class_uri: ota:DeviceNetworkInfo
    title: Device Network Info
    description: >-
      Device Network Info is the network configuration last reported by a device.
    attributes:
      ota_DeviceNetworkInfo_localIpV4Address:
        slot_uri: ota:DeviceNetworkInfo_localIpV4Address
        alias: localIpV4Address
        title: localIpV4Address
        description: The local IPv4 address of the device.
        range: string
        multivalued: false
        required: false
      ota_DeviceNetworkInfo_hostname:
        slot_uri: ota:DeviceNetworkInfo_hostname
        alias: hostname
        title: hostname
        description: The hostname of the device.
        range: string
        multivalued: false
        required: false
      ota_DeviceNetworkInfo_macAddress:
        slot_uri: ota:DeviceNetworkInfo_macAddress
        alias: macAddress
        title: macAddress
        description: The MAC address of the device's network interface.
        range: string
        multivalued: false
        required: false

  ota_Ecu:
    is_a: core_Resource
    in_subset: ota
    class_uri: ota:Ecu
    title: ECU
    description: >-
      ECU represents an electronic control unit within a device. Each device has exactly
      one primary ECU; secondary ECUs are updated through the primary ECU (Uptane).
    attributes:
      ota_Ecu_ecuId:
        slot_uri: ota:Ecu_ecuId
        alias: ecuId
        title: ecuId
        description: The ECU identifier (serial) unique within the device. At most 64 characters.
        range: string
        multivalued: false
        required: true
        identifier: true
      ota_Ecu_hardwareId:
        slot_uri: ota:Ecu_hardwareId
        alias: hardwareId
        title: hardwareId
        description: The hardware identifier indicating the ECU type.
        range: string
        multivalued: false
        required: true
      ota_Ecu_isPrimary:
        slot_uri: ota:Ecu_isPrimary
        alias: isPrimary
        title: isPrimary
        description: >-
          Indicates whether this is the primary ECU of the device. Exactly one ECU of a
          device must be primary; this is not enforced by the schema and must be checked
          by the consumer.
        range: boolean
        multivalued: false
        required: false
      ota_Ecu_installedPackageName:
        slot_uri: ota:Ecu_installedPackageName
        alias: installedPackageName
        title: installedPackageName
        description: >-
          The name of the software currently installed on the ECU, as reported by the device.
          Always set from the device report, whether or not it matches a registered package.
        range: string
        multivalued: false
        required: false
      ota_Ecu_installedVersion:
        slot_uri: ota:Ecu_installedVersion
        alias: installedVersion
        title: installedVersion
        description: >-
          The version of the software currently installed on the ECU, as reported by the device.
          Always set from the device report, whether or not it matches a registered package.
        range: string
        multivalued: false
        required: false
      ota_Ecu_installedPackage:
        slot_uri: ota:Ecu_installedPackage
        alias: installedPackage
        title: installedPackage
        description: >-
          The registered package matching installedPackageName and installedVersion.
          Absent when the installed software does not match any registered package.
        range: ota_Package
        multivalued: false
        required: false
      ota_Ecu_installedPackageCategory:
        slot_uri: ota:Ecu_installedPackageCategory
        alias: installedPackageCategory
        title: installedPackageCategory
        description: The category of the software currently installed on the ECU.
        range: ota_PackageCategory
        multivalued: false
        required: false
      ota_Ecu_isAssigned:
        slot_uri: ota:Ecu_isAssigned
        alias: isAssigned
        title: isAssigned
        description: Indicates whether an update is currently assigned to the ECU.
        range: boolean
        multivalued: false
        required: false

  ota_Fleet:
    is_a: core_Artifact
    in_subset: ota
    class_uri: ota:Fleet
    title: Fleet
    description: >-
      Fleet represents a named group of devices managed and updated together.
    annotations:
      grid: grid:workspace:{workspace-id}:ota:fleet/{id}
      maturity: EXPERIMENTAL
    slots:
      - core_name
      - ota_Fleet_devices
    slot_usage:
      core_name:
        description: The fleet name.
        required: true
    attributes:
      ota_Fleet_createdAt:
        slot_uri: ota:Fleet_createdAt
        alias: createdAt
        title: createdAt
        description: The date and time the fleet was created, in UTC.
        range: datetime
        multivalued: false
        required: true

  ota_Package:
    is_a: core_Artifact
    in_subset: ota
    class_uri: ota:Package
    title: Package
    description: >-
      Package represents one version of a software package registered for OTA deployment.
      A package is identified by its name and version; the version list of a package is
      the set of packages sharing the same name.
    annotations:
      grid: grid:workspace:{workspace-id}:ota:package/{id}
      maturity: EXPERIMENTAL
    slots:
      - core_name
      - core_description
    slot_usage:
      core_name:
        description: The package name. Packages sharing a name are versions of the same package.
        required: true
    attributes:
      ota_Package_version:
        slot_uri: ota:Package_version
        alias: version
        title: version
        description: The version identifier assigned to this package.
        range: string
        multivalued: false
        required: true
      ota_Package_payloadUri:
        slot_uri: ota:Package_payloadUri
        alias: payloadUri
        title: payloadUri
        description: URI identifying or locating the package payload, when available.
        range: uri
        multivalued: false
        required: false
      ota_Package_size:
        slot_uri: ota:Package_size
        alias: size
        title: size
        description: The size of the package binary in bytes.
        range: integer
        multivalued: false
        required: true
      ota_Package_hashes:
        slot_uri: ota:Package_hashes
        alias: hashes
        title: hashes
        description: >-
          The checksums of the package binary. This is optional in the generic model;
          integrity-enforcing distribution profiles must require at least one hash and
          any required signature metadata.
        range: ota_PackageHash
        multivalued: true
        required: false
        inlined: true
        inlined_as_list: true
      ota_Package_hardwareIds:
        slot_uri: ota:Package_hardwareIds
        alias: hardwareIds
        title: hardwareIds
        description: The hardware identifiers of the ECUs compatible with the package.
        range: string
        multivalued: true
        required: false
      ota_Package_createdAt:
        slot_uri: ota:Package_createdAt
        alias: createdAt
        title: createdAt
        description: The date and time the package was registered, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Package_source:
        slot_uri: ota:Package_source
        alias: source
        title: source
        description: The source the package was registered from, for example an upload or an external repository.
        range: string
        multivalued: false
        required: false
      ota_Package_packageType:
        slot_uri: ota:Package_packageType
        alias: packageType
        title: packageType
        description: The package format reported by the provider, for example ostree or binary.
        range: string
        multivalued: false
        required: false

  ota_PackageHash:
    is_a: core_Resource
    in_subset: ota
    class_uri: ota:PackageHash
    title: Package Hash
    description: >-
      Package Hash is a checksum of a package binary, used for Uptane target metadata.
    attributes:
      ota_PackageHash_algorithm:
        slot_uri: ota:PackageHash_algorithm
        alias: algorithm
        title: algorithm
        description: The lowercase hash algorithm identifier, for example sha256 or sha512.
        range: string
        multivalued: false
        required: true
      ota_PackageHash_value:
        slot_uri: ota:PackageHash_value
        alias: value
        title: value
        description: >-
          The hash value encoded as hexadecimal characters. Its length must match the
          digest length of the algorithm (64 characters for sha256, 128 for sha512).
        range: string
        multivalued: false
        required: true

  ota_Deployment:
    is_a: core_Activity
    in_subset: ota
    class_uri: ota:Deployment
    title: Deployment
    description: >-
      Deployment represents an OTA update that assigns packages to the ECUs of its target,
      either a single device or all devices of a single fleet. Provider-specific
      scheduling and cancellation restrictions are defined by the corresponding API profile.
    annotations:
      grid: grid:workspace:{workspace-id}:ota:deployment/{id}
      maturity: EXPERIMENTAL
    slots:
      - ota_Deployment_targetDevice
      - ota_Deployment_targetFleet
    exactly_one_of:
      - slot_conditions:
          ota_Deployment_targetDevice:
            required: true
      - slot_conditions:
          ota_Deployment_targetFleet:
            required: true
    attributes:
      ota_Deployment_status:
        slot_uri: ota:Deployment_status
        alias: status
        title: status
        description: The overall status of the deployment.
        range: ota_DeploymentStatus
        multivalued: false
        required: true
      ota_Deployment_createdAt:
        slot_uri: ota:Deployment_createdAt
        alias: createdAt
        title: createdAt
        description: The date and time the deployment was created, in UTC.
        range: datetime
        multivalued: false
        required: true
      ota_Deployment_scheduledFor:
        slot_uri: ota:Deployment_scheduledFor
        alias: scheduledFor
        title: scheduledFor
        description: The date and time the deployment is scheduled to start, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Deployment_completedAt:
        slot_uri: ota:Deployment_completedAt
        alias: completedAt
        title: completedAt
        description: The date and time the deployment finished, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Deployment_assignments:
        slot_uri: ota:Deployment_assignments
        alias: assignments
        title: assignments
        description: >-
          The packages assigned per hardware identifier, at least one. These correspond
          to the targets in Uptane terminology.
        range: ota_DeploymentAssignment
        multivalued: true
        minimum_cardinality: 1
        required: true
        inlined: true
        inlined_as_list: true
      ota_Deployment_deviceResults:
        slot_uri: ota:Deployment_deviceResults
        alias: deviceResults
        title: deviceResults
        description: The per-device execution results of the deployment, not its target declaration.
        range: ota_DeploymentDeviceResult
        multivalued: true
        required: false
        inlined: true
        inlined_as_list: true

  ota_DeploymentAssignment:
    is_a: core_Resource
    in_subset: ota
    class_uri: ota:DeploymentAssignment
    title: Deployment Assignment
    description: >-
      Deployment Assignment assigns a package to the ECUs with a given hardware identifier.
      Deployment requests may name packages only; the provider then resolves the hardware
      identifier from the package and the target device's ECUs.
    attributes:
      ota_DeploymentAssignment_hardwareId:
        slot_uri: ota:DeploymentAssignment_hardwareId
        alias: hardwareId
        title: hardwareId
        description: >-
          The hardware identifier of the target ECUs. When absent, the package is assigned
          to the ECUs whose hardware identifier is listed in the package's hardwareIds; the
          package must then list at least one hardware identifier, otherwise the assignment
          is invalid and must be rejected.
        range: string
        multivalued: false
        required: false
      ota_DeploymentAssignment_package:
        slot_uri: ota:DeploymentAssignment_package
        alias: package
        title: package
        description: The package to install on the target ECUs.
        range: ota_Package
        multivalued: false
        required: true

  ota_DeploymentDeviceResult:
    is_a: core_Resource
    in_subset: ota
    class_uri: ota:DeploymentDeviceResult
    title: Deployment Device Result
    description: >-
      Deployment Device Result is the outcome of a deployment on one target device.
    attributes:
      ota_DeploymentDeviceResult_device:
        slot_uri: ota:DeploymentDeviceResult_device
        alias: device
        title: device
        description: The target device.
        range: ota_Device
        multivalued: false
        required: true
      ota_DeploymentDeviceResult_status:
        slot_uri: ota:DeploymentDeviceResult_status
        alias: status
        title: status
        description: The deployment status on the device.
        range: ota_DeploymentStatus
        multivalued: false
        required: true
      ota_DeploymentDeviceResult_completedAt:
        slot_uri: ota:DeploymentDeviceResult_completedAt
        alias: completedAt
        title: completedAt
        description: The date and time the deployment finished on the device, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_DeploymentDeviceResult_isSuccessful:
        slot_uri: ota:DeploymentDeviceResult_isSuccessful
        alias: isSuccessful
        title: isSuccessful
        description: Indicates whether the deployment on the device succeeded, once reported.
        range: boolean
        multivalued: false
        required: false
      ota_DeploymentDeviceResult_resultCode:
        slot_uri: ota:DeploymentDeviceResult_resultCode
        alias: resultCode
        title: resultCode
        description: The result code reported by the device.
        range: string
        multivalued: false
        required: false
      ota_DeploymentDeviceResult_resultDescription:
        slot_uri: ota:DeploymentDeviceResult_resultDescription
        alias: resultDescription
        title: resultDescription
        description: The human-readable result reported by the device.
        range: string
        multivalued: false
        required: false
      ota_DeploymentDeviceResult_componentResults:
        slot_uri: ota:DeploymentDeviceResult_componentResults
        alias: componentResults
        title: componentResults
        description: The per-ECU results of the deployment on the device.
        range: ota_DeploymentComponentResult
        multivalued: true
        required: false
        inlined: true
        inlined_as_list: true
      ota_DeploymentDeviceResult_events:
        slot_uri: ota:DeploymentDeviceResult_events
        alias: events
        title: events
        description: The timeline of events reported for the deployment on the device.
        range: ota_DeploymentEvent
        multivalued: true
        required: false
        inlined: true
        inlined_as_list: true

  ota_DeploymentComponentResult:
    is_a: core_Resource
    in_subset: ota
    class_uri: ota:DeploymentComponentResult
    title: Deployment Component Result
    description: >-
      Deployment Component Result is the outcome of a deployment on one ECU (Uptane component)
      of a target device.
    attributes:
      ota_DeploymentComponentResult_ecuId:
        slot_uri: ota:DeploymentComponentResult_ecuId
        alias: ecuId
        title: ecuId
        description: The identifier of the ECU the package was assigned to. At most 64 characters.
        range: string
        multivalued: false
        required: true
      ota_DeploymentComponentResult_hardwareId:
        slot_uri: ota:DeploymentComponentResult_hardwareId
        alias: hardwareId
        title: hardwareId
        description: The hardware identifier of the ECU.
        range: string
        multivalued: false
        required: true
      ota_DeploymentComponentResult_package:
        slot_uri: ota:DeploymentComponentResult_package
        alias: package
        title: package
        description: The package assigned to the ECU.
        range: ota_Package
        multivalued: false
        required: true
      ota_DeploymentComponentResult_isSuccessful:
        slot_uri: ota:DeploymentComponentResult_isSuccessful
        alias: isSuccessful
        title: isSuccessful
        description: Indicates whether the installation on the ECU succeeded, once reported.
        range: boolean
        multivalued: false
        required: false
      ota_DeploymentComponentResult_resultCode:
        slot_uri: ota:DeploymentComponentResult_resultCode
        alias: resultCode
        title: resultCode
        description: The result code reported for the ECU.
        range: string
        multivalued: false
        required: false
      ota_DeploymentComponentResult_resultDescription:
        slot_uri: ota:DeploymentComponentResult_resultDescription
        alias: resultDescription
        title: resultDescription
        description: The human-readable result reported for the ECU.
        range: string
        multivalued: false
        required: false

  ota_DeploymentEvent:
    is_a: core_Event
    in_subset: ota
    class_uri: ota:DeploymentEvent
    title: Deployment Event
    description: >-
      Deployment Event is a single event, such as download or installation progress,
      reported by an ECU during a deployment.
    attributes:
      ota_DeploymentEvent_deviceTime:
        slot_uri: ota:DeploymentEvent_deviceTime
        alias: deviceTime
        title: deviceTime
        description: The date and time the event occurred according to the device clock, in UTC.
        range: datetime
        multivalued: false
        required: true
      ota_DeploymentEvent_receivedAt:
        slot_uri: ota:DeploymentEvent_receivedAt
        alias: receivedAt
        title: receivedAt
        description: The date and time the server received the event, in UTC.
        range: datetime
        multivalued: false
        required: true
      ota_DeploymentEvent_eventType:
        slot_uri: ota:DeploymentEvent_eventType
        alias: eventType
        title: eventType
        description: The event type identifier, for example EcuDownloadStarted or EcuInstallationCompleted.
        range: string
        multivalued: false
        required: true
      ota_DeploymentEvent_eventTypeVersion:
        slot_uri: ota:DeploymentEvent_eventTypeVersion
        alias: eventTypeVersion
        title: eventTypeVersion
        description: The version of the event type schema.
        range: integer
        multivalued: false
        required: false
      ota_DeploymentEvent_ecuId:
        slot_uri: ota:DeploymentEvent_ecuId
        alias: ecuId
        title: ecuId
        description: The identifier of the ECU that reported the event. At most 64 characters.
        range: string
        multivalued: false
        required: false
      ota_DeploymentEvent_isSuccessful:
        slot_uri: ota:DeploymentEvent_isSuccessful
        alias: isSuccessful
        title: isSuccessful
        description: Indicates whether the reported step succeeded, when applicable.
        range: boolean
        multivalued: false
        required: false

slots:

  ota_Fleet_devices:
    is_a: core_hasPart
    slot_uri: ota:Fleet_devices
    alias: devices
    title: devices
    description: Devices in this fleet
    domain: ota_Fleet
    range: ota_Device
    multivalued: true
    required: false

  ota_Deployment_targetDevice:
    is_a: core_hasInput
    slot_uri: ota:Deployment_targetDevice
    alias: targetDevice
    title: targetDevice
    description: >-
      The single device targeted by the deployment. Exactly one of targetDevice and
      targetFleet must be set.
    domain: ota_Deployment
    range: ota_Device
    multivalued: false
    required: false

  ota_Deployment_targetFleet:
    is_a: core_hasInput
    slot_uri: ota:Deployment_targetFleet
    alias: targetFleet
    title: targetFleet
    description: >-
      The fleet targeted by the deployment; all devices of the fleet are addressed.
      Exactly one of targetDevice and targetFleet must be set.
    domain: ota_Deployment
    range: ota_Fleet
    multivalued: false
    required: false
