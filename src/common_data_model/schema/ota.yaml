id: https://w3id.org/altium/cdm/ota/
name: cdm-ota
prefixes:
  linkml: https://w3id.org/linkml/
  core: https://w3id.org/altium/cdm/core/
  ota: https://w3id.org/altium/cdm/ota/
imports:
  - linkml:types

default_range: string
default_prefix: ota

subsets:
  ota:
    description: >-
      Models over-the-air (OTA) firmware and software updates: devices with the packages installed on
      them, fleets that group devices, packages with their version, size, checksums and target hardware,
      deployments that request packages to be rolled out to a device or fleet, and the deployment
      results that record the outcome on each targeted device.
      All classes are experimental.
    annotations:
      style: "fill:#d29292"
      productDocs: none

enums:

  ota_DeviceStatus:
    is_a: Enumeration
    in_subset: ota
    enum_uri: ota:DeviceStatus
    description: The OTA update status of a device.
    implements:
      - owl:NamedIndividual
    permissible_values:
      NotSeen:
        description: The device has not connected to the platform yet.
      Error:
        description: The last update reported an error.
      UpToDate:
        description: The installed software matches the assigned software.
      UpdatePending:
        description: An update is assigned and waits to be delivered.
      Outdated:
        description: The installed software differs from the assigned software.
      UpdateScheduled:
        description: An update is scheduled for a future date and time.

  ota_DeploymentStatus:
    is_a: Enumeration
    in_subset: ota
    enum_uri: ota:DeploymentStatus
    description: >-
      The status of a deployment on one target device, reported by its Deployment Result.
      Success or failure of a completed deployment is reported by the result's isSuccessful.
    implements:
      - owl:NamedIndividual
    permissible_values:
      Pending:
        description: The deployment is created and not yet received by the device.
      Scheduled:
        description: The deployment is scheduled to start at a future date and time.
      InProgress:
        description: The device has received the update instructions and is installing.
      Completed:
        description: >-
          The deployment finished, either successfully or with a failure. A partially completed
          deployment, where only some ECUs installed successfully, is also Completed, with
          isSuccessful false.
      Cancelled:
        description: The deployment was cancelled before it was received by the device.

  ota_PackageCategory:
    is_a: Enumeration
    in_subset: ota
    enum_uri: ota:PackageCategory
    description: The category of OTA software, either a package or the software installed on an ECU.
    implements:
      - owl:NamedIndividual
    permissible_values:
      Base:
        description: The base operating system or the application for a primary ECU.
      Bootloader:
        description: The bootloader.
      Applications:
        description: Application software.
      Other:
        description: Any other software or the application for a secondary ECU.

classes:

  ota_Device:
    is_a: core_Artifact
    in_subset: ota
    class_uri: ota:Device
    title: Device
    description: >-
      Device represents a physical unit registered for OTA updates. A device consists of
      one primary ECU and optional secondary ECUs, and may belong to fleets.
    annotations:
      grid: grid:workspace:{workspace-id}:ota:device/{id}
      maturity: EXPERIMENTAL
    slots:
      - core_name
      - core_description
    slot_usage:
      core_description:
        description: Free-form notes associated with the device.
    attributes:
      ota_Device_deviceId:
        slot_uri: ota:Device_deviceId
        alias: deviceId
        title: device id
        description: The device-side identifier provided at provisioning.
        range: string
        multivalued: false
        required: false
      ota_Device_hardwareId:
        slot_uri: ota:Device_hardwareId
        alias: hardwareId
        title: hardware id
        description: >-
          The hardware type of the device as a whole (for example the product or board type), as
          reported by the provider, when provided. It is independent of the hardware identifiers
          of the device's ECUs, which Package.hardwareIds and DeploymentAssignment.hardwareId
          are matched against.
        range: string
        multivalued: false
        required: false
      ota_Device_status:
        slot_uri: ota:Device_status
        alias: status
        title: status
        description: Current device status
        range: ota_DeviceStatus
        multivalued: false
        required: false
      ota_Device_lastSeenAt:
        slot_uri: ota:Device_lastSeenAt
        alias: lastSeenAt
        title: last seen at
        description: The date and time the device last connected, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Device_createdAt:
        slot_uri: ota:Device_createdAt
        alias: createdAt
        title: created at
        description: The date and time the device was registered, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Device_activatedAt:
        slot_uri: ota:Device_activatedAt
        alias: activatedAt
        title: activated at
        description: The date and time the device first connected, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Device_lastUpdatedAt:
        slot_uri: ota:Device_lastUpdatedAt
        alias: lastUpdatedAt
        title: last updated at
        description: The date and time the device was last updated, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Device_hibernated:
        slot_uri: ota:Device_hibernated
        alias: hibernated
        title: hibernated
        description: Indicates whether the device is hibernated and excluded from updates.
        range: boolean
        multivalued: false
        required: false
      ota_Device_packages:
        slot_uri: ota:Device_packages
        alias: packages
        title: packages
        description: >-
          The registered packages installed on the device, when known, referenced by their GRID.
        range: ota_Package
        multivalued: true
        required: false

  ota_Fleet:
    is_a: core_Artifact
    in_subset: ota
    class_uri: ota:Fleet
    title: Fleet
    description: >-
      Fleet represents a named group of devices managed and updated together.
    annotations:
      grid: grid:workspace:{workspace-id}:ota:fleet/{id}
      maturity: EXPERIMENTAL
    slots:
      - core_name
    slot_usage:
      core_name:
        description: The fleet name.
    attributes:
      ota_Fleet_createdAt:
        slot_uri: ota:Fleet_createdAt
        alias: createdAt
        title: created at
        description: The date and time the fleet was created, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Fleet_devices:
        slot_uri: ota:Fleet_devices
        alias: devices
        title: devices
        description: >-
          The devices that are members of this fleet. A device can be a member of several
          fleets, so this is an association, not compositional containment.
        range: ota_Device
        multivalued: true
        required: false

  ota_Package:
    is_a: core_Artifact
    in_subset: ota
    class_uri: ota:Package
    title: Package
    description: >-
      Package represents one version of a software package registered for OTA deployment.
      A package is identified by its name and version; the version list of a package is
      the set of packages sharing the same name.
    annotations:
      grid: grid:workspace:{workspace-id}:ota:package/{id}
      maturity: EXPERIMENTAL
    slots:
      - core_name
      - core_description
    slot_usage:
      core_name:
        description: The package name. Packages sharing a name are versions of the same package.
    attributes:
      ota_Package_version:
        slot_uri: ota:Package_version
        alias: version
        title: version
        description: The version identifier assigned to this package.
        range: string
        multivalued: false
        required: false
      ota_Package_size:
        slot_uri: ota:Package_size
        alias: size
        title: size
        description: The size of the package binary in bytes.
        range: integer
        multivalued: false
        required: false
      ota_Package_hashes:
        slot_uri: ota:Package_hashes
        alias: hashes
        title: hashes
        description: >-
          The checksums of the package binary. This is optional in the generic model;
          integrity-enforcing distribution profiles must require at least one hash and
          any required signature metadata.
        range: ota_PackageHash
        multivalued: true
        required: false
        inlined: true
        inlined_as_list: true
      ota_Package_hardwareIds:
        slot_uri: ota:Package_hardwareIds
        alias: hardwareIds
        title: hardware ids
        description: >-
          The hardware identifiers of the ECU types compatible with the package, matched against
          the hardware identifiers reported by the ECUs of the target devices.
        range: string
        multivalued: true
        required: false
      ota_Package_createdAt:
        slot_uri: ota:Package_createdAt
        alias: createdAt
        title: created at
        description: The date and time the package was registered, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Package_packageType:
        slot_uri: ota:Package_packageType
        alias: packageType
        title: package type
        description: The package format reported by the provider, for example ostree or binary.
        range: string
        multivalued: false
        required: false

  ota_PackageHash:
    is_a: core_Resource
    in_subset: ota
    class_uri: ota:PackageHash
    title: Package Hash
    description: >-
      Package Hash is a checksum of a package binary, used for Uptane target metadata.
    attributes:
      ota_PackageHash_algorithm:
        slot_uri: ota:PackageHash_algorithm
        alias: algorithm
        title: algorithm
        description: The lowercase hash algorithm identifier, for example sha256 or sha512.
        range: string
        multivalued: false
        required: false
      ota_PackageHash_value:
        slot_uri: ota:PackageHash_value
        alias: value
        title: value
        description: >-
          The hash value encoded as hexadecimal characters. Its length must match the
          digest length of the algorithm (64 characters for sha256, 128 for sha512).
        range: string
        multivalued: false
        required: false

  ota_Deployment:
    is_a: core_Activity
    in_subset: ota
    class_uri: ota:Deployment
    title: Deployment
    description: >-
      Deployment represents the request for an OTA update that assigns packages to the ECUs of
      its target, either a single device or all devices of a single fleet. It records what was
      requested, not how it was carried out: the outcome on each targeted device is a separate
      Deployment Result, which refers to the deployment. Provider-specific scheduling and
      cancellation restrictions are defined by the corresponding API profile.
    annotations:
      grid: grid:workspace:{workspace-id}:ota:deployment/{id}
      maturity: EXPERIMENTAL
    exactly_one_of:
      - slot_conditions:
          ota_Deployment_targetDevice:
            required: true
      - slot_conditions:
          ota_Deployment_targetFleet:
            required: true
    attributes:
      ota_Deployment_targetDevice:
        is_a: core_occursIn
        slot_uri: ota:Deployment_targetDevice
        alias: targetDevice
        title: target device
        description: >-
          The single device targeted by the deployment. Exactly one of targetDevice and
          targetFleet must be set.
        range: ota_Device
        multivalued: false
        required: false
      ota_Deployment_targetFleet:
        is_a: core_occursIn
        slot_uri: ota:Deployment_targetFleet
        alias: targetFleet
        title: target fleet
        description: >-
          The fleet targeted by the deployment; all devices of the fleet are addressed.
          Exactly one of targetDevice and targetFleet must be set.
        range: ota_Fleet
        multivalued: false
        required: false
      ota_Deployment_createdAt:
        slot_uri: ota:Deployment_createdAt
        alias: createdAt
        title: created at
        description: >-
          The date and time the deployment was requested, in UTC, when reported by the provider.
          Some providers report only the creation time of the update for each device, see
          DeploymentResult.createdAt.
        range: datetime
        multivalued: false
        required: false
      ota_Deployment_scheduledFor:
        slot_uri: ota:Deployment_scheduledFor
        alias: scheduledFor
        title: scheduled for
        description: The date and time the deployment is scheduled to start, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_Deployment_assignments:
        slot_uri: ota:Deployment_assignments
        alias: assignments
        title: assignments
        description: >-
          The packages assigned per hardware identifier, at least one. These correspond
          to the targets in Uptane terminology.
        range: ota_DeploymentAssignment
        multivalued: true
        minimum_cardinality: 1
        required: true
        inlined: true
        inlined_as_list: true

  ota_DeploymentAssignment:
    is_a: core_Resource
    in_subset: ota
    class_uri: ota:DeploymentAssignment
    title: Deployment Assignment
    description: >-
      Deployment Assignment assigns a package to the ECUs with a given hardware identifier.
      Deployment requests may name packages only; the provider then resolves the hardware
      identifier from the package and the target device's ECUs.
    attributes:
      ota_DeploymentAssignment_hardwareId:
        slot_uri: ota:DeploymentAssignment_hardwareId
        alias: hardwareId
        title: hardware id
        description: >-
          The hardware identifier of the target ECUs. When absent, the package is assigned
          to the ECUs whose hardware identifier is listed in the package's hardwareIds; the
          package must then list at least one hardware identifier, otherwise the assignment
          is invalid and must be rejected.
        range: string
        multivalued: false
        required: false
      ota_DeploymentAssignment_package:
        slot_uri: ota:DeploymentAssignment_package
        alias: package
        title: package
        description: The package to install on the target ECUs, referenced by its GRID.
        range: ota_Package
        multivalued: false
        required: true

  ota_DeploymentResult:
    is_a: core_Artifact
    in_subset: ota
    class_uri: ota:DeploymentResult
    title: Deployment Result
    description: >-
      Deployment Result is the outcome of a deployment on one target device, from the time the
      device is addressed by the deployment, before its update is created. It is kept apart
      from the deployment, which records the request: the request is fixed when it is created,
      while the result is updated from the reports of the device as the update progresses. A
      device deployment has one result; a fleet deployment has one result per device of the fleet.
    annotations:
      grid: grid:workspace:{workspace-id}:ota:deployment-result/{id}
      maturity: EXPERIMENTAL
    attributes:
      ota_DeploymentResult_deployment:
        is_a: core_outputOf
        slot_uri: ota:DeploymentResult_deployment
        alias: deployment
        title: deployment
        description: The deployment whose outcome this result records, referenced by its GRID.
        range: ota_Deployment
        multivalued: false
        required: true
      ota_DeploymentResult_device:
        slot_uri: ota:DeploymentResult_device
        alias: device
        title: device
        description: The target device the result applies to, referenced by its GRID.
        range: ota_Device
        multivalued: false
        required: false
      ota_DeploymentResult_createdAt:
        slot_uri: ota:DeploymentResult_createdAt
        alias: createdAt
        title: created at
        description: >-
          The date and time the update for the device was created from the deployment, in UTC.
          For a fleet deployment the updates of the devices are created after the deployment and
          at different times, so this can differ from Deployment.createdAt. Absent while the
          update for the device has not been created yet.
        range: datetime
        multivalued: false
        required: false
      ota_DeploymentResult_status:
        slot_uri: ota:DeploymentResult_status
        alias: status
        title: status
        description: The status of the deployment on the device.
        range: ota_DeploymentStatus
        multivalued: false
        required: false
      ota_DeploymentResult_completedAt:
        slot_uri: ota:DeploymentResult_completedAt
        alias: completedAt
        title: completed at
        description: The date and time the deployment finished on the device, in UTC.
        range: datetime
        multivalued: false
        required: false
      ota_DeploymentResult_isSuccessful:
        slot_uri: ota:DeploymentResult_isSuccessful
        alias: isSuccessful
        title: is successful
        description: >-
          Indicates whether the deployment on the device succeeded, once reported. False when
          any ECU of the device failed to install its package.
        range: boolean
        multivalued: false
        required: false
      ota_DeploymentResult_resultCode:
        slot_uri: ota:DeploymentResult_resultCode
        alias: resultCode
        title: result code
        description: The result code reported by the device.
        range: string
        multivalued: false
        required: false
      ota_DeploymentResult_resultDescription:
        slot_uri: ota:DeploymentResult_resultDescription
        alias: resultDescription
        title: result description
        description: The human-readable result reported by the device.
        range: string
        multivalued: false
        required: false
