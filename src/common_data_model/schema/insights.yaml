id: https://w3id.org/altium/cdm/insights/
name: cdm-insights
prefixes:
  linkml: https://w3id.org/linkml/
  ins: https://w3id.org/altium/cdm/insights/

imports:
  - linkml:types

default_range: string
default_prefix: ins

subsets:
  insights:
    title: Insights
    description: >-
      Models insights: findings, detected asynchronously, that give the user insight within one domain area and
      can be followed up by tasks. There are two concrete kinds. A part insight concerns one Workspace part,
      may be informed by BOMs or design projects, and occurs in BOM releases, project releases or component
      revisions. A design insight concerns a design and is part of a design review.
    annotations:
      style: "fill:#a64d79"
      productDocs: none

classes:

  ins_Insight:
    is_a: core_Activity
    in_subset: insights
    abstract: true
    class_uri: ins:Insight
    title: Insight
    description: >-
      A finding, detected asynchronously, that gives the user insight within one domain area: the library
      (part insights) or design (design insights). Insights can be followed up by tasks.
    comments:
      - Working definition from the model owner; insights have no public product documentation yet.
    annotations:
      grid: grid:workspace:{workspace-id}:insights:insight/{id}
      platformAPI: DesWorkspaceInsInsight
    attributes:
      ins_Insight_tasks:
        is_a: core_informs
        slot_uri: ins:Insight_tasks
        alias: tasks
        title: tasks
        description: Task associated with this insight
        range: col_Task
        required: false
        multivalued: true

  ins_PartInsight:
    is_a: ins_Insight
    in_subset: insights
    class_uri: ins:PartInsight
    title: Part Insight
    description: >-
      TBD
    attributes:
      ins_PartInsight_part:
        is_a: core_informs
        slot_uri: ins:PartInsight_part
        alias: part
        title: part
        description: Part associated with this insight
        range: lib_Part
        required: true
        multivalued: false
      ins_PartInsight_informedBy:
        is_a: core_informedBy
        slot_uri: ins:PartInsight_informedBy
        alias: informedBy
        title: informed by
        description: Entities associated with this insight
        range: Any
        any_of:
          - range: pro_BomWIP
          - range: des_Project
        required: false
        multivalued: true
      ins_PartInsight_occursIn:
        is_a: core_occursIn
        slot_uri: ins:PartInsight_occursIn
        alias: occursIn
        title: occurs in
        description: Entities associated with this insight
        range: Any
        any_of:
          - range: pro_BomRelease
          - range: des_ProjectRelease
          - range: lib_ComponentRevision
        required: false
        multivalued: true

  ins_DesignInsight:
    is_a: ins_Insight
    in_subset: insights
    class_uri: ins:DesignInsight
    title: Design Insight
    description: >-
      An insight within the design domain: a finding, detected asynchronously, about the design under review in
      a design review. It is always part of that review and can be followed up by tasks.
    annotations:
      productDocs: none
    attributes:
      ins_DesignInsight_designReview:
        is_a: core_partOf
        slot_uri: ins:DesignInsight_designReview
        alias: designReview
        title: design review
        description: The design review that the insight is part of.
        range: col_DesignReview
        required: true
        multivalued: false
