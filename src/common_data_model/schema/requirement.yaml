id: https://w3id.org/altium/cdm/requirement/
name: cdm-requirement
prefixes:
  linkml: https://w3id.org/linkml/
  req: https://w3id.org/altium/cdm/requirement/

imports:
  - linkml:types

default_range: string
default_prefix: req

subsets:
  requirements:
    description: >-
      Captures behavioral, performance, compliance, and process expectations that govern solutions
      throughout conception, design, verification, and release lifecycle milestones.
    annotations:
      style: "fill:#f6b26b"
      maturity: EXPERIMENTAL

classes:
  req_Requirement:
    is_a: core_Artifact
    in_subset: requirements
    class_uri: req:Requirement
    title: Requirement
    description: >-
      A single, testable statement of intent or constraint that governs a solution or process outcome.
    comments:
      - Requirements aggregate rationales, acceptance criteria, and trace links needed to drive
        downstream design and verification.
    annotations:
      grid: grid:workspace:{workspace-id}:requirements:requirement/{id}
      maturity: EXPERIMENTAL
    slots:
      - core_revisions
    slot_usage:
      core_revisions:
        range: req_RequirementRevision
    attributes:
      req_Requirement_identifier:
        alias: identifier
        slot_uri: req:Requirement_identifier
        title: key
        description: >-
          Human-friendly identifier that is unique within a specification context (e.g. SYS-001).
        range: string
        required: true
        multivalued: false
      req_Requirement_title:
        alias: title
        slot_uri: req:Requirement_title
        title: title
        description: Concise human-readable title of the requirement.
        range: string
        required: true
        multivalued: false
      req_Requirement_text:
        alias: text
        slot_uri: req:Requirement_text
        title: statement
        description: Canonical textual form of the requirement.
        range: string
        required: true
        multivalued: false
      req_Requirement_rationale:
        alias: rationale
        slot_uri: req:Requirement_rationale
        title: rationale
        description: Justification or reasoning that motivates the requirement intent.
        range: string
        required: false
        multivalued: false
      req_Requirement_category:
        alias: category
        slot_uri: req:Requirement_category
        title: category
        description: Classification such as functional, safety, regulatory, or usability.
        range: string
        required: false
        multivalued: false
      req_Requirement_priority:
        alias: priority
        slot_uri: req:Requirement_priority
        title: priority
        description: Relative importance or sequencing hint for planning.
        range: string
        required: false
        multivalued: false
      req_Requirement_acceptanceCriteria:
        alias: acceptanceCriteria
        slot_uri: req:Requirement_acceptanceCriteria
        title: acceptanceCriteria
        description: Objective criteria or measurements that prove the requirement is met.
        range: string
        required: false
        multivalued: true
      req_Requirement_owner:
        alias: owner
        slot_uri: req:Requirement_owner
        title: owner
        description: Responsible role or team accountable for the requirement.
        range: string
        required: false
        multivalued: false
      req_Requirement_sourceReference:
        alias: sourceReference
        slot_uri: req:Requirement_sourceReference
        title: sourceReference
        description: Link or citation to originating contract, regulation, or customer input.
        range: uriorcurie
        required: false
        multivalued: true
      req_Requirement_children:
        is_a: core_hasPart
        slot_uri: req:Requirement_children
        alias: children
        title: children
        description: Requirements that refine or decompose this requirement.
        range: req_Requirement
        multivalued: true
        required: false
      req_Requirement_parent:
        is_a: core_partOf
        slot_uri: req:Requirement_parent
        alias: parent
        title: parent
        description: Higher-level requirement that allocates scope to this requirement.
        range: req_Requirement
        multivalued: false
        required: false
      req_Requirement_satisfiedByArtifacts:
        slot_uri: req:Requirement_satisfiedBy
        alias: satisfiedByArtifacts
        title: satisfied by artifacts
        description: Artifacts, designs, or solutions that implement this requirement.
        range: req_Artifact
        multivalued: true
        required: false
      req_Requirement_verifiedByActivities:
        slot_uri: req:Requirement_verifiedBy
        alias: verifiedByActivities
        title: verified by activities
        description: Verification activities that produce evidence for this requirement.
        range: core_Activity
        multivalued: true
        required: false
      req_Requirement_tracedFromSources:
        slot_uri: req:Requirement_tracedFrom
        alias: tracedFromSources
        title: traced from sources
        description: Upstream sources such as contracts, standards, or customer requests.
        range: req_Artifact
        multivalued: true
        required: false

  req_RequirementRevision:
    is_a: core_Artifact
    in_subset: requirements
    class_uri: req:RequirementRevision
    title: Requirement Revision
    description: An immutable snapshot of a requirement statement at a specific revision.
    mixins:
      - plt_HasLifecycle
    annotations:
      grid: grid:workspace:{workspace-id}:requirements:requirement-revision/{id}
      maturity: EXPERIMENTAL
    slots:
      - core_revisionOf
    slot_usage:
      core_revisionOf:
        range: req_Requirement
    attributes:
      req_RequirementRevision_number:
        alias: number
        slot_uri: req:RequirementRevision_number
        title: number
        description: Ordinal or semver-like revision number.
        range: string
        required: true
        multivalued: false
      req_RequirementRevision_changeSummary:
        alias: changeSummary
        slot_uri: req:RequirementRevision_changeSummary
        title: changeSummary
        description: Concise description of what changed in this revision.
        range: string
        required: false
        multivalued: false
      req_RequirementRevision_derivesFromChange:
        slot_uri: req:RequirementRevision_derivesFromChange
        alias: derivesFromChange
        title: derives from change
        description: Change request that authorized this requirement revision.
        range: req_RequirementChangeRequest
        multivalued: false
        required: false

  req_RequirementSpecification:
    is_a: core_Artifact
    in_subset: requirements
    class_uri: req:RequirementSpecification
    title: Requirement Specification
    description: >-
      A curated collection of requirements scoped to a program, domain, or release horizon.
    annotations:
      grid: grid:workspace:{workspace-id}:requirements:specification/{id}
      maturity: EXPERIMENTAL
    slots:
      - core_revisions
    slot_usage:
      core_revisions:
        range: req_RequirementBaseline
    attributes:
      req_RequirementSpecification_name:
        alias: name
        slot_uri: req:RequirementSpecification_name
        title: name
        description: Human-readable name for the specification (e.g. "System Requirements").
        range: string
        required: true
        multivalued: false
      req_RequirementSpecification_description:
        alias: description
        slot_uri: req:RequirementSpecification_description
        title: description
        description: Narrative describing the boundaries and context of the specification.
        range: string
        required: false
        multivalued: false
      req_RequirementSpecification_owner:
        alias: owner
        slot_uri: req:RequirementSpecification_owner
        title: owner
        description: Role or organization managing this specification.
        range: string
        required: false
        multivalued: false
      req_RequirementSpecification_includesRequirements:
        is_a: core_hasPart
        slot_uri: req:RequirementSpecification_requirements
        alias: includesRequirements
        title: includes requirements
        description: Requirements curated under this specification.
        range: req_Requirement
        multivalued: true
        required: true
      req_RequirementSpecification_targetsProjects:
        slot_uri: req:RequirementSpecification_targetsProjects
        alias: targetsProjects
        title: targets projects
        description: Requirements projects that receive scope from this specification.
        range: req_Project
        multivalued: true
        required: false
      req_RequirementSpecification_inputs:
        slot_uri: req:RequirementSpecification_inputs
        alias: inputs
        title: inputs
        description: Artifacts or agreements that feed this specification.
        range: req_Artifact
        multivalued: true
        required: false

  req_RequirementBaseline:
    is_a: core_Artifact
    in_subset: requirements
    class_uri: req:RequirementBaseline
    title: Requirement Baseline
    description: >-
      A version-managed release of a specification or subset of requirements approved for execution.
    mixins:
      - plt_HasLifecycle
    annotations:
      grid: grid:workspace:{workspace-id}:requirements:baseline/{id}
      maturity: EXPERIMENTAL
    attributes:
      req_RequirementBaseline_identifier:
        alias: identifier
        slot_uri: req:RequirementBaseline_identifier
        title: identifier
        description: Distinguishing label for the approved baseline (e.g. BL-2025.1).
        range: string
        required: true
        multivalued: false
      req_RequirementBaseline_notes:
        alias: notes
        slot_uri: req:RequirementBaseline_notes
        title: notes
        description: Additional context for the approval, deviations, or applicability limits.
        range: string
        required: false
        multivalued: false
      req_RequirementBaseline_ofSpecification:
        slot_uri: req:RequirementBaseline_ofSpecification
        alias: ofSpecification
        title: of specification
        description: Specification for which this baseline is approved.
        range: req_RequirementSpecification
        multivalued: false
        required: true
      req_RequirementBaseline_includesRequirements:
        is_a: core_hasPart
        slot_uri: req:RequirementBaseline_includesRequirements
        alias: includesRequirements
        title: includes requirements
        description: Specific requirements frozen into this baseline.
        range: req_Requirement
        multivalued: true
        required: true
      req_RequirementBaseline_targetsProjectReleases:
        slot_uri: req:RequirementBaseline_targetsProjectReleases
        alias: targetsProjectReleases
        title: targets project releases
        description: Project releases that must comply with this baseline.
        range: des_ProjectRelease
        multivalued: true
        required: false

  req_RequirementChangeRequest:
    is_a: core_Activity
    in_subset: requirements
    class_uri: req:RequirementChangeRequest
    title: Requirement Change Request
    description: Structured workflow item proposing additions, updates, or removals of requirements.
    annotations:
      grid: grid:workspace:{workspace-id}:requirements:change-request/{id}
      maturity: EXPERIMENTAL
    attributes:
      req_RequirementChangeRequest_reason:
        alias: reason
        slot_uri: req:RequirementChangeRequest_reason
        title: reason
        description: Business, technical, or compliance driver motivating the change.
        range: string
        required: true
        multivalued: false
      req_RequirementChangeRequest_priority:
        alias: priority
        slot_uri: req:RequirementChangeRequest_priority
        title: priority
        description: Handling urgency for backlog triage.
        range: string
        required: false
        multivalued: false
      req_RequirementChangeRequest_decision:
        alias: decision
        slot_uri: req:RequirementChangeRequest_decision
        title: decision
        description: Outcome such as approved, rejected, or deferred.
        range: string
        required: false
        multivalued: false
      req_RequirementChangeRequest_impactsRequirements:
        slot_uri: req:RequirementChange_impactsRequirements
        alias: impactsRequirements
        title: impacts requirements
        description: Requirements directly impacted by the change request.
        range: req_Requirement
        multivalued: true
        required: true
      req_RequirementChangeRequest_impactsSpecifications:
        slot_uri: req:RequirementChange_impactsSpecifications
        alias: impactsSpecifications
        title: impacts specifications
        description: Specifications that must be updated when processing the change.
        range: req_RequirementSpecification
        multivalued: true
        required: false
      req_RequirementChangeRequest_generatesRevisions:
        slot_uri: req:RequirementChange_generatesRevisions
        alias: generatesRevisions
        title: generates revisions
        description: Requirement revisions produced as the outcome of the change request.
        range: req_RequirementRevision
        multivalued: true
        required: false

  req_Project:
    is_a: core_Activity
    in_subset: requirements
    class_uri: req:Project
    title: Requirements Project
    description: >-
      The orchestration space for capturing, evolving, and validating requirements scoped to a product,
      program increment, or regulatory engagement.
    comments:
      - Provides planning scaffolding comparable to Hardware Projects, enabling traceable alignment
        between requirement deliverables and downstream design artifacts.
      - >-
        Future linking ideas: establish cross-domain slots that map requirement projects to design
        projects, and synchronize milestone states via baselines vs. releases.
    annotations:
      grid: grid:workspace:{workspace-id}:requirements:project/{id}
      maturity: EXPERIMENTAL
    attributes:
      req_Project_name:
        alias: name
        slot_uri: req:Project_name
        title: name
        description: Compact display name for the requirement effort.
        range: string
        required: true
        multivalued: false
      req_Project_description:
        alias: description
        slot_uri: req:Project_description
        title: description
        description: Longer narrative describing objectives, scope, and constraints.
        range: string
        required: false
        multivalued: false
      req_Project_owner:
        alias: owner
        slot_uri: req:Project_owner
        title: owner
        description: Responsible program, platform team, or external stakeholder.
        range: string
        required: false
        multivalued: false
      req_Project_specifications:
        is_a: core_hasPart
        slot_uri: req:Project_specifications
        alias: specifications
        title: specifications
        description: Specifications authored or curated within this requirements project.
        range: req_RequirementSpecification
        multivalued: true
        required: true
      req_Project_baselines:
        is_a: core_hasPart
        slot_uri: req:Project_baselines
        alias: baselines
        title: baselines
        description: Baselines approved under this project to govern execution.
        range: req_RequirementBaseline
        multivalued: true
        required: false
      req_Project_changeRequests:
        slot_uri: req:Project_changeRequests
        alias: changeRequests
        title: change requests
        description: Change requests logged against this requirements project.
        range: req_RequirementChangeRequest
        multivalued: true
        required: false
      req_Project_verificationCases:
        slot_uri: req:Project_verificationCases
        alias: verificationCases
        title: verification cases
        description: Verification cases scoped to this project for coverage planning.
        range: req_VerificationCase
        multivalued: true
        required: false
      req_Project_artifacts:
        slot_uri: req:Project_artifacts
        alias: artifacts
        title: artifacts
        description: Supporting artifacts (models, audits, customer inputs) managed by the project.
        range: req_Artifact
        multivalued: true
        required: false

  req_VerificationCase:
    is_a: core_Activity
    in_subset: requirements
    class_uri: req:VerificationCase
    title: Verification Case
    description: >-
      A planned verification procedure or test that produces objective evidence against requirements.
    annotations:
      grid: grid:workspace:{workspace-id}:requirements:verification-case/{id}
      maturity: EXPERIMENTAL
    attributes:
      req_VerificationCase_identifier:
        alias: identifier
        slot_uri: req:VerificationCase_identifier
        title: identifier
        description: External-facing identifier or document number for the verification case.
        range: string
        required: true
        multivalued: false
      req_VerificationCase_method:
        alias: method
        slot_uri: req:VerificationCase_method
        title: method
        description: Verification technique such as analysis, inspection, demonstration, or test.
        range: string
        required: true
        multivalued: false
      req_VerificationCase_environment:
        alias: environment
        slot_uri: req:VerificationCase_environment
        title: environment
        description: Description of lab, simulation, or operational context for execution.
        range: string
        required: false
        multivalued: false
      req_VerificationCase_result:
        alias: result
        slot_uri: req:VerificationCase_result
        title: result
        description: Pass/fail or summary of latest execution outcome.
        range: string
        required: false
        multivalued: false
      req_VerificationCase_validatesRequirements:
        slot_uri: req:VerificationCase_validatesRequirements
        alias: validatesRequirements
        title: validates requirements
        description: Requirements validated by executing this verification case.
        range: req_Requirement
        multivalued: true
        required: true
      req_VerificationCase_usesArtifacts:
        slot_uri: req:VerificationCase_usesArtifacts
        alias: usesArtifacts
        title: uses artifacts
        description: Test articles, prototypes, or simulations consumed during verification.
        range: req_Artifact
        multivalued: true
        required: false
      req_VerificationCase_generatesEvidence:
        slot_uri: req:VerificationCase_generatesEvidence
        alias: generatesEvidence
        title: generates evidence
        description: Reports, datasets, or other artifacts captured as verification evidence.
        range: req_Artifact
        multivalued: true
        required: false
      req_VerificationCase_triggersChanges:
        slot_uri: req:VerificationCase_triggersChanges
        alias: triggersChanges
        title: triggers changes
        description: Change requests created due to verification findings.
        range: req_RequirementChangeRequest
        multivalued: true
        required: false

  req_Artifact:
    is_a: core_Resource
    in_subset: requirements
    class_uri: req:Artifact
    title: Requirement Artifact
    description: TBD
