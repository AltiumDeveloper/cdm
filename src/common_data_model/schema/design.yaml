    comments:
    - '[interpretation] DesignDataNet_Preview.lines is read as the wires of the net: the AD SDK equivalent, INet.DM_Lines,
      returns ILine, described as a line object on a schematic document.'
    - The Platform API serves only location and bounding rectangle; vertices are available from the AD SDK (ISch_Wire inherits
