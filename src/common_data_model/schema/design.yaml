id: https://w3id.org/altium/cdm/design/
name: cdm-design
prefixes:
  linkml: https://w3id.org/linkml/
  des: https://w3id.org/altium/cdm/design/

imports:
  - linkml:types

default_range: string
default_prefix: des

subsets:
  design:
    description: >-
      Provides a comprehensive environment for schematic capture, PCB layout, and simulation. It enables engineers to create, analyze, 
      and optimize electronic designs with seamless integration into the broader Altium ecosystem.
    annotations:
      style: "fill:#93c47d"

classes:

  des_udm_design_export:
    is_a: Resource
    in_subset: design
    class_uri: des:udmDesignExport
    title: udm design export
    description: A udm representation of a project design export that contains CAD design data.
    tree_root: true
    attributes:
      data:
        slot_uri: des:udmDesignExport_data
        range: des_udm_export_data
        required: true
      extensions:
        slot_uri: des:udmDesignExport_extensions
        range: des_udm_export_extensions
        required: false

  des_udm_export_data:
    is_a: Resource
    in_subset: design
    class_uri: des:udmExportData
    description: Wraps the exported udm design payload for a project.
    attributes:
      design:
        slot_uri: des:udmExportData_design
        range: des_udm_export_design
        required: true

  des_udm_export_design:
    is_a: Resource
    in_subset: design
    class_uri: des:udmExportDesign
    description: Holds the udm design view for a project export.
    attributes:
      preview:
        slot_uri: des:udmExportDesign_preview
        range: des_udm_design_preview
        required: true

  des_udm_design_preview:
    is_a: Resource
    in_subset: design
    class_uri: des:udmDesignPreview
    description: Stores the latest available udm design preview for a project.
    attributes:
      latestGeneration:
        slot_uri: des:udmDesignPreview_latestGeneration
        range: des_udm_design_generation
        required: true

  des_udm_design_generation:
    is_a: Resource
    in_subset: design
    class_uri: des:udmDesignGeneration
    description: Captures the generation status and payload for a udm design export.
    attributes:
      status:
        slot_uri: des:udmDesignGeneration_status
        range: des_generation_status
        required: true
      message:
        slot_uri: des:udmDesignGeneration_message
        range: string
        required: false
      designData:
        slot_uri: des:udmDesignGeneration_designData
        range: des_udm_design_data
        required: true

  des_udm_design_data:
    is_a: Resource
    in_subset: design
    class_uri: des:udmDesignData
    description: Contains the CAD design documents, variants, and configuration for the project's udm view.
    attributes:
      documents:
        slot_uri: des:udmDesignData_documents
        range: des_design_document
        multivalued: true
        required: false
      variants:
        slot_uri: des:udmDesignData_variants
        range: des_design_variant
        multivalued: true
        required: false
      configuration:
        slot_uri: des:udmDesignData_configuration
        range: des_design_configuration
        required: false

  des_udm_export_extensions:
    is_a: Resource
    in_subset: design
    class_uri: des:udmExportExtensions
    description: Carries optional metadata associated with a udm design export request.
    attributes:
      requestId:
        slot_uri: des:udmExportExtensions_requestId
        range: string
        required: false

  des_design_configuration:
    is_a: Resource
    in_subset: design
    class_uri: des:DesignConfiguration
    attributes:
      customChecks:
        slot_uri: des:DesignConfiguration_customChecks
        range: des_design_custom_check
        multivalued: true
        required: false

  des_design_custom_check:
    is_a: Resource
    in_subset: design
    class_uri: des:DesignCustomCheck
    attributes:
      customCheckId:
        slot_uri: des:DesignCustomCheck_customCheckId
        range: string
        required: true
      des_DesignCustomCheck_name:
        slot_uri: des:DesignCustomCheck_name
        alias: name
        range: string
        required: true
      errorReportLevel:
        slot_uri: des:DesignCustomCheck_errorReportLevel
        range: des_error_report_level
        required: true

  des_design_document:
    is_a: Resource
    in_subset: design
    class_uri: des:DesignDocument
    attributes:
      documentId:
        slot_uri: des:DesignDocument_documentId
        range: string
        required: true
      components:
        slot_uri: des:DesignDocument_components
        range: des_design_component
        multivalued: true
        required: false
      nets:
        slot_uri: des:DesignDocument_nets
        range: des_design_net
        multivalued: true
        required: false

  des_design_component:
    is_a: Resource
    in_subset: design
    class_uri: des:DesignComponent
    attributes:
      uniqueId:
        slot_uri: des:DesignComponent_uniqueId
        range: string
        required: true
      physicalDesignator:
        slot_uri: des:DesignComponent_physicalDesignator
        range: string
        required: false
      logicalDesignator:
        slot_uri: des:DesignComponent_logicalDesignator
        range: string
        required: false
      parameters:
        slot_uri: des:DesignComponent_parameters
        range: des_design_parameter
        multivalued: true
        required: false
      parts:
        slot_uri: des:DesignComponent_parts
        range: des_design_component_part
        multivalued: true
        required: false

  des_design_component_part:
    is_a: Resource
    in_subset: design
    class_uri: des:DesignComponentPart
    attributes:
      uniqueId:
        slot_uri: des:DesignComponentPart_uniqueId
        range: string
        required: true
      logicalDesignator:
        slot_uri: des:DesignComponentPart_logicalDesignator
        range: string
        required: false
      physicalDesignator:
        slot_uri: des:DesignComponentPart_physicalDesignator
        range: string
        required: false
      vaultGuid:
        slot_uri: des:DesignComponentPart_vaultGuid
        range: string
        required: false
      itemGuid:
        slot_uri: des:DesignComponentPart_itemGuid
        range: string
        required: false
      revisionGuid:
        slot_uri: des:DesignComponentPart_revisionGuid
        range: string
        required: false
      variantId:
        slot_uri: des:DesignComponentPart_variantId
        range: string
        required: false
      variationKind:
        slot_uri: des:DesignComponentPart_variationKind
        range: des_component_variation_kind
        required: false
      parameters:
        slot_uri: des:DesignComponentPart_parameters
        range: des_design_parameter
        multivalued: true
        required: false
      boundingRectangle:
        slot_uri: des:DesignComponentPart_boundingRectangle
        range: des_bounding_rectangle
        required: false
      location:
        slot_uri: des:DesignComponentPart_location
        range: des_location
        required: false
      pins:
        slot_uri: des:DesignComponentPart_pins
        range: des_design_pin
        multivalued: true
        required: false

  des_design_parameter:
    is_a: Resource
    in_subset: design
    class_uri: des:DesignParameter
    attributes:
      des_DesignParameter_name:
        slot_uri: des:DesignParameter_name
        alias: name
        range: string
        required: true
      value:
        slot_uri: des:DesignParameter_value
        range: string
        required: false

  des_design_pin:
    is_a: Resource
    in_subset: design
    class_uri: des:DesignPin
    attributes:
      uniqueId:
        slot_uri: des:DesignPin_uniqueId
        range: string
        required: true
      des_DesignPin_name:
        slot_uri: des:DesignPin_name
        alias: name
        range: string
        required: false
      number:
        slot_uri: des:DesignPin_number
        range: string
        required: false
      location:
        slot_uri: des:DesignPin_location
        range: des_location
        required: false
      boundingRectangle:
        slot_uri: des:DesignPin_boundingRectangle
        range: des_bounding_rectangle
        required: false

  des_design_net:
    is_a: Resource
    in_subset: design
    class_uri: des:DesignNet
    attributes:
      uniqueId:
        slot_uri: des:DesignNet_uniqueId
        range: string
        required: false
      des_DesignNet_name:
        slot_uri: des:DesignNet_name
        alias: name
        range: string
        required: false
      calculatedNetName:
        slot_uri: des:DesignNet_calculatedNetName
        range: string
        required: false
      color:
        slot_uri: des:DesignNet_color
        range: integer
        required: false
      parameters:
        slot_uri: des:DesignNet_parameters
        range: des_design_parameter
        multivalued: true
        required: false
      boundingRectangle:
        slot_uri: des:DesignNet_boundingRectangle
        range: des_bounding_rectangle
        required: false
      location:
        slot_uri: des:DesignNet_location
        range: des_location
        required: false
      netItems:
        slot_uri: des:DesignNet_netItems
        range: des_design_net_item
        multivalued: true
        required: false
      pins:
        slot_uri: des:DesignNet_pins
        range: des_design_pin
        multivalued: true
        required: false
      lines:
        slot_uri: des:DesignNet_lines
        range: des_design_line
        multivalued: true
        required: false

  des_design_net_item:
    is_a: Resource
    in_subset: design
    class_uri: des:DesignNetItem
    attributes:
      kind:
        slot_uri: des:DesignNetItem_kind
        range: des_net_item_kind
        required: true
      uniqueId:
        slot_uri: des:DesignNetItem_uniqueId
        range: string
        required: true

  des_design_line:
    is_a: Resource
    in_subset: design
    class_uri: des:DesignLine
    attributes:
      uniqueId:
        slot_uri: des:DesignLine_uniqueId
        range: string
        required: true
      boundingRectangle:
        slot_uri: des:DesignLine_boundingRectangle
        range: des_bounding_rectangle
        required: false
      location:
        slot_uri: des:DesignLine_location
        range: des_location
        required: false

  des_bounding_rectangle:
    is_a: Resource
    in_subset: design
    class_uri: des:BoundingRectangle
    attributes:
      left:
        slot_uri: des:BoundingRectangle_left
        range: integer
        required: true
      bottom:
        slot_uri: des:BoundingRectangle_bottom
        range: integer
        required: true
      right:
        slot_uri: des:BoundingRectangle_right
        range: integer
        required: true
      top:
        slot_uri: des:BoundingRectangle_top
        range: integer
        required: true

  des_location:
    is_a: Resource
    in_subset: design
    class_uri: des:Location
    attributes:
      x:
        slot_uri: des:Location_x
        range: integer
        required: true
      y:
        slot_uri: des:Location_y
        range: integer
        required: true

  des_design_variant:
    is_a: des_project_variant
    in_subset: design
    class_uri: des:DesignVariant
    attributes:
      des_DesignVariant_name:
        slot_uri: des:DesignVariant_name
        alias: name
        range: string
        required: true
      variantGuid:
        slot_uri: des:DesignVariant_variantGuid
        range: string
        required: true
      variations:
        slot_uri: des:DesignVariant_variations
        range: des_design_variant_variation
        multivalued: true
        required: false

  des_design_variant_variation:
    is_a: Resource
    in_subset: design
    class_uri: des:DesignVariantVariation
    attributes:
      componentDesignator:
        slot_uri: des:DesignVariantVariation_componentDesignator
        range: string
        required: true
      componentUniqueId:
        slot_uri: des:DesignVariantVariation_componentUniqueId
        range: string
        required: true
      kind:
        slot_uri: des:DesignVariantVariation_kind
        range: des_component_variation_kind
        required: true
      alternatePart:
        slot_uri: des:DesignVariantVariation_alternatePart
        range: string
        required: false

  des_project:
    is_a: Activity
    in_subset: design 
    class_uri: des:Project
    title: Hardware Project
    description: TBD
    aliases:
      - PCB Project
    mixins:
      - SolutionItem
    annotations:
      grid: grid:workspace:{workspace-id}:design:project/{id}
      platformAPI: DesProject
    attributes:
      des_Project_parameters:
        slot_uri: des:Project_parameters
        alias: parameters
        title: parameters
        description: TBD
        range: des_project_parameter
        multivalued: true
        required: false
      des_Project_variants:
        slot_uri: des:Project_variants
        alias: variants
        title: variants
        description: TBD
        range: des_project_variant
        multivalued: true
    slots:
      - core_releases
      - lib_uses_parts
      - lib_uses_components
    slot_usage:
      core_releases:
        range: des_project_release

  des_project_parameter:
    is_a: Resource
    in_subset: design
    class_uri: des:ProjectParameter
    title: Project Parameter
    description: TBD
    annotations:
      platformAPI: DesProjectParameter
    attributes:
      des_ProjectParameter_name:
        slot_uri: des:ProjectParameter_name
        alias: name
        title: name
        description: TBD
        range: string
        multivalued: false
        required: true
      des_ProjectParameter_value:
        slot_uri: des:ProjectParameter_value
        alias: value
        title: value
        description: TBD
        range: string
        multivalued: false
        required: false

  des_project_variant:
    is_a: Resource
    in_subset: design 
    class_uri: des:ProjectVariant
    title: Hardware Project Variant
    description: TBD
    annotations:
      platformAPI: DesWipVariant

  des_multiboard_project:
    is_a: des_project
    in_subset: design 
    class_uri: des:MultiboardProject
    title: Multiboard Project
    description: 
      Multiboard Project represents the coordinated design of multiple interconnected PCB projects assembled into a single system, 
      capturing both their logical interconnects and physical arrangements.
    comments:
      - Multiboard Project serves as an aggregate that composes individual board Projects into a higher-level system entity, 
        maintaining identity and traceability across design boundaries. It enables engineers to define harnesses, connectors, and 
        mechanical fit at the system level, while preserving the autonomy of each board design, thus supporting codesign, simulation, 
        and integration workflows across ECAD and MCAD domains.
    annotations:
      platformAPI: DesProject
    slots:
      - des_multiboard_project_projects

  des_harness_project:
    is_a: des_project
    in_subset: design 
    class_uri: des:HarnessProject
    title: Harness Project
    description: 
      Harness Project defines the design of a cable and wiring harness as a standalone yet integrable artifact, capturing connectors, 
      wires, splices, and pin-to-pin mappings required to implement electrical interconnects between boards and system elements. 
    comments:
      - Harness Project provides a structured representation of connectivity at the physical wiring level, complementing schematic and 
        PCB projects while maintaining its own lifecycle and identity. It enables engineers to design, document, and validate interconnects 
        in a way that is traceable, manufacturable, and tightly integrated with Multiboard and MCAD workflows within the Altium ecosystem.
    annotations:
      platformAPI: DesProject

  des_project_release:
    is_a: Activity
    in_subset: design 
    class_uri: des:ProjectRelease
    title: Hardware Project Release
    description: 
      Project Release captures an immutable snapshot of a PCB design project at a specific point in its lifecycle, packaging all design data, 
      outputs, and metadata required for manufacturing, assembly, and downstream processes. 
    comments:
      - Project Release serves as the authoritative artifact that bridges design and production, ensuring repeatability, traceability, and regulatory compliance. 
        Its identity is tied to the originating Project but remains stable as a versioned deliverable, enabling teams to collaborate confidently, audit changes, 
        and integrate with supply chain and PLM systems through Altium 365 and related workflows.
    annotations:
      grid: grid:workspace:{workspace-id}:design:project-release/{id}
      platformAPI: DesRelease
    mixins:
      - HasLifecycle
    slots:
      - lib_consists_of_components

  des_project_template:
    is_a: Artifact
    in_subset: design 
    class_uri: des:ProjectTemplate
    title: Project Template
    description:
      A project template includes document configurations and settings that you know you will frequently apply to various projects. 
    comments:
      - Project templates can include the common document and file types that make up a project, as well as additional reference documentation 
        and configuration files. Project options configured in a project template will also be applied when creating design projects using this template. 
        The advantage of using project templates is that a template can contain, if required, a full set of common project files 
        (including Output Jobs) and ratified project/document options, design rules, parameters, units settings, document title blocks, 
        grid settings, project release options, and much more.
      - Project templates can be created for PCB, multi-board and harness project types.
    annotations:
      grid: grid:workspace:{workspace-id}:design:project-template/{id}
      platformAPI: DesProjectTemplate
    slots:
      - core_revisions
    slot_usage:
      core_revisions:
        range: des_project_template_revision

  des_project_template_revision:
    is_a: Artifact
    in_subset: design 
    class_uri: des:ProjectTemplateRevision
    title: Project Template Revision
    description: >-
      An immutable revision of a project template.
    annotations:
      grid: grid:workspace:{workspace-id}:design:project-template-revision/{id}
      platformAPI: DesProjectTemplateRevision
    mixins:
      - HasLifecycle

  des_manufacturing_package:
    is_a: Artifact
    in_subset: design 
    class_uri: des:ManufacturingPackage
    title: Manufacturing Package
    description: >-
      A read-only package that contains a subset of Project Release artifacts that is typically shared with an external party for the purposes 
      of manufacturing the board (e.g. Manufacturing Package may contain fabrication/assembly files required by the factories, but not the sources of the project)
    annotations:
      grid: grid:workspace:{workspace-id}:design:manufacturing-package/{id}
    slots:
      - des_manufacturing_package_project_release

enums:

  des_generation_status:
    permissible_values:
      COMPLETED:
      FAILED:
      IN_PROGRESS:

  des_error_report_level:
    permissible_values:
      NO_REPORT:
      WARNING:
      ERROR:

  des_net_item_kind:
    permissible_values:
      Sheet Entry:
      Pin:
      Net Label:
      Port:
      Power Object:

  des_component_variation_kind:
    permissible_values:
      NOT_FITTED:
      eVariation_NotFitted:
      eVariation_Alternate:

slots:

  uniqueId:
    slot_uri: des:uniqueId
    range: string
    required: false

  logicalDesignator:
    slot_uri: des:logicalDesignator
    range: string
    required: false

  physicalDesignator:
    slot_uri: des:physicalDesignator
    range: string
    required: false

  parameters:
    slot_uri: des:parameters
    range: des_design_parameter
    multivalued: true
    required: false

  boundingRectangle:
    slot_uri: des:boundingRectangle
    range: des_bounding_rectangle
    required: false

  location:
    slot_uri: des:location
    range: des_location
    required: false

  pins:
    slot_uri: des:pins
    range: des_design_pin
    multivalued: true
    required: false

  kind:
    slot_uri: des:kind
    range: string
    required: false
 
  des_multiboard_project_projects:
    is_a: core_hasPart
    slot_uri: des:MultiboardProject_projects
    title: projects
    description: The individual PCB projects that make up this Multiboard Project.
    domain: des_multiboard_project
    range: des_project
    multivalued: true
    required: false

  des_manufacturing_package_project_release:
    is_a: core_derivedFrom
    slot_uri: des:ManufacturingPackage_projectRelease
    title: projectRelease
    description: Manufacturing Packages are created based on a specific Project Release.
    range: des_project_release
    required: true
