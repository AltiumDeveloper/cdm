      components, pads, tracks and vias, and the copper nets they form.'
    comments:
    - The Platform API serves it per variant (DesWipVariant.pcb, DesReleaseVariant.pcb), not under DesignData_Preview; it
      is attached to Compiled Design here so that one traversal reaches both the logical and the physical design (see G7,
      two schematic paths).
    - Arcs, polygons (copper pours), regions, fills, text, dimensions, rooms and design rules are available in the AD SDK
      (IPCB_Arc, IPCB_Polygon, IPCB_Region, ...) but not in the Platform API, and are out of scope of this draft.
    - DesPcb.mesh3D is marked PROTOTYPE in the Platform API and is out of scope.
