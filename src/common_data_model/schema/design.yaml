id: https://w3id.org/altium/cdm/design/
name: cdm-design
prefixes:
  linkml: https://w3id.org/linkml/
  des: https://w3id.org/altium/cdm/design/

imports:
  - linkml:types

default_range: string
default_prefix: des

subsets:
  design:
    title: Design
    description: >-
      Models design projects stored in a Workspace, including multi-board and harness projects, with their
      parameters, variants and releases, the manufacturing packages shared from releases, project templates
      with their revisions, and rule checks run against projects. It corresponds to Workspace projects in
      Altium 365 and Altium Designer, from project creation through to design release.
    see_also:
      - https://www.altium.com/documentation/altium-365/workspace-projects
      - https://www.altium.com/documentation/altium-365/management-specific-project
      - https://www.altium.com/documentation/altium-designer/preparing-for-manufacture/design-release
    annotations:
      style: "fill:#93c47d"

classes:

  des_Project:
    is_a: core_Activity
    in_subset: design 
    class_uri: des:Project
    title: Hardware Project
    description: >-
      A design project stored in a Workspace, normally under its built-in version control, such as a PCB project. It
      groups the design documents that together define one implementation of a product, along with its project
      parameters and variants; it is the source from which releases are made and from which Managed BOMs can be
      created.
    aliases:
      - PCB Project
    mixins:
      - plt_SolutionItem
    annotations:
      grid: grid:workspace:{workspace-id}:design:project/{id}
      platformAPI: DesProject
      adSDK: EDP.IProject
    see_also:
      - https://www.altium.com/documentation/altium-365/workspace-projects
      - https://www.altium.com/documentation/altium-designer/creating-projects-documents
    structured_aliases:
      - literal_form: Workspace project
        predicate: EXACT_SYNONYM
        contexts: [altium-365, altium-designer]
        source: https://www.altium.com/documentation/altium-365/workspace-projects
      - literal_form: design project
        predicate: RELATED_SYNONYM
        contexts: [altium-designer, altium-365]
        source: https://www.altium.com/documentation/altium-designer/creating-projects-documents
    attributes:
      des_Project_parameters:
        slot_uri: des:Project_parameters
        alias: parameters
        title: parameters
        description: TBD
        range: des_ProjectParameter
        multivalued: true
        required: false
      des_Project_variants:
        slot_uri: des:Project_variants
        alias: variants
        title: variants
        description: TBD
        range: des_ProjectVariant
        multivalued: true
        required: false
    slots:
      - core_releases
      - lib_uses_parts
      - lib_uses_components
    slot_usage:
      core_releases:
        range: des_ProjectRelease

  des_ProjectParameter:
    is_a: core_Resource
    in_subset: design
    class_uri: des:ProjectParameter
    title: Project Parameter
    description: >-
      A name/value parameter defined at the level of a design project. It is either a Workspace-side (server-side)
      parameter, kept with the project in the Workspace and editable only there, or a design-side parameter, kept in
      the project file (e.g. *.PrjPcb) and editable in Altium Designer. Both kinds appear in the project options and can be
      used as special strings in design documents.
    annotations:
      platformAPI: DesProjectParameter
    see_also:
      - https://www.altium.com/documentation/altium-365/workspace-projects#project_parameters
      - https://www.altium.com/documentation/altium-designer/accessing-defining-managing-project-options#parameters
    attributes:
      des_ProjectParameter_name:
        slot_uri: des:ProjectParameter_name
        alias: name
        title: name
        description: TBD
        range: string
        multivalued: false
        required: true
      des_ProjectParameter_value:
        slot_uri: des:ProjectParameter_value
        alias: value
        title: value
        description: TBD
        range: string
        multivalued: false
        required: false

  des_ProjectVariant:
    is_a: core_Resource
    in_subset: design 
    class_uri: des:ProjectVariant
    title: Hardware Project Variant
    description: >-
      A design variant of a project: a named variation of the same base design that is assembled with a different set
      of components. Within a variant, each component can be fitted, not fitted, fitted with varied parameters, or
      replaced by an alternate part, and the variant can define its own variant-level parameters. Assembly variants
      share one bare board, whereas fabrication variants also change overlay information and so need a different board.
    annotations:
      platformAPI: DesWipVariant
      adSDK: EDP.IProjectVariant
    see_also:
      - https://www.altium.com/documentation/altium-designer/design-variants
      - https://www.altium.com/documentation/altium-designer/variant-manager
    structured_aliases:
      - literal_form: design variant
        predicate: EXACT_SYNONYM
        contexts: [altium-designer]
        source: https://www.altium.com/documentation/altium-designer/design-variants

  des_MultiboardProject:
    is_a: des_Project
    in_subset: design 
    class_uri: des:MultiboardProject
    title: Multiboard Project
    description: 
      Multiboard Project represents the coordinated design of multiple interconnected PCB projects assembled into a single system, 
      capturing both their logical interconnects and physical arrangements.
    comments:
      - Multiboard Project serves as an aggregate that composes individual board Projects into a higher-level system entity, 
        maintaining identity and traceability across design boundaries. It enables engineers to define harnesses, connectors, and 
        mechanical fit at the system level, while preserving the autonomy of each board design, thus supporting codesign, simulation, 
        and integration workflows across ECAD and MCAD domains.
    see_also:
      - https://www.altium.com/documentation/altium-designer/multi-board-design#structure_multi_board_design_project
    attributes:
      des_MultiboardProject_projects:
        is_a: core_hasPart
        slot_uri: des:MultiboardProject_projects
        alias: projects
        title: projects
        description: The individual PCB projects that make up this Multiboard Project.
        range: des_Project
        multivalued: true
        required: false

  des_HarnessProject:
    is_a: des_Project
    in_subset: design 
    class_uri: des:HarnessProject
    title: Harness Project
    description: 
      Harness Project defines the design of a cable and wiring harness as a standalone yet integrable artifact, capturing connectors, 
      wires, splices, and pin-to-pin mappings required to implement electrical interconnects between boards and system elements. 
    comments:
      - Harness Project provides a structured representation of connectivity at the physical wiring level, complementing schematic and 
        PCB projects while maintaining its own lifecycle and identity. It enables engineers to design, document, and validate interconnects 
        in a way that is traceable, manufacturable, and tightly integrated with Multiboard and MCAD workflows within the Altium ecosystem.
    see_also:
      - https://www.altium.com/documentation/altium-designer/harness-design

  des_ProjectRelease:
    is_a: core_Artifact
    in_subset: design 
    class_uri: des:ProjectRelease
    title: Hardware Project Release
    description: 
      Project Release captures an immutable snapshot of a PCB design project at a specific point in its lifecycle, packaging all design data, 
      outputs, and metadata required for manufacturing, assembly, and downstream processes. 
    comments:
      - Project Release serves as the authoritative artifact that bridges design and production, ensuring repeatability, traceability, and regulatory compliance. 
        Its identity is tied to the originating Project but remains stable as a versioned deliverable, enabling teams to collaborate confidently, audit changes, 
        and integrate with supply chain and PLM systems through Altium 365 and related workflows.
    annotations:
      grid: grid:workspace:{workspace-id}:design:project-release/{id}
      platformAPI: DesRelease
    see_also:
      - https://www.altium.com/documentation/altium-designer/preparing-for-manufacture/design-release
      - https://www.altium.com/documentation/altium-designer/preparing-for-manufacture/design-release/workspace
    structured_aliases:
      - literal_form: design project release
        predicate: RELATED_SYNONYM
        contexts: [altium-designer]
        source: https://www.altium.com/documentation/altium-designer/preparing-for-manufacture/design-release
    mixins:
      - plt_HasLifecycle
    slots:
      - lib_consists_of_components

  des_ProjectTemplate:
    is_a: core_Artifact
    in_subset: design 
    class_uri: des:ProjectTemplate
    title: Project Template
    description: >-
      A reusable starting point for new design projects that bundles the documents, files and project settings a team
      wants to apply again and again. A project created from a template receives the template's documents and its
      project options.
    comments:
      - Besides the usual project documents, a template may carry reference documentation, configuration files and
        Output Jobs, together with agreed project and document settings such as design rules, parameters, title blocks
        and release options.
      - Templates are available for PCB, multi-board and harness projects. A Workspace project template is kept as a
        series of revisions; saving an edited template creates its next revision, and new projects are based on the
        latest revisions shared with the user.
    annotations:
      grid: grid:workspace:{workspace-id}:design:project-template/{id}
      platformAPI: DesProjectTemplate
    see_also:
      - https://www.altium.com/documentation/altium-designer/creating-project-template
    slots:
      - core_revisions
    slot_usage:
      core_revisions:
        range: des_ProjectTemplateRevision

  des_ProjectTemplateRevision:
    is_a: core_Artifact
    in_subset: design 
    class_uri: des:ProjectTemplateRevision
    title: Project Template Revision
    description: >-
      An immutable revision of a project template.
    annotations:
      grid: grid:workspace:{workspace-id}:design:project-template-revision/{id}
      platformAPI: DesProjectTemplateRevision
    mixins:
      - plt_HasLifecycle

  des_ManufacturingPackage:
    is_a: core_Artifact
    in_subset: design 
    class_uri: des:ManufacturingPackage
    title: Manufacturing Package
    description: >-
      A read-only package that contains a subset of Project Release artifacts that is typically shared with an external party for the purposes 
      of manufacturing the board (e.g. Manufacturing Package may contain fabrication/assembly files required by the factories, but not the sources of the project)
    annotations:
      grid: grid:workspace:{workspace-id}:design:manufacturing-package/{id}
    see_also:
      - https://www.altium.com/documentation/altium-365/viewers/manufacturing-package-viewer
      - https://www.altium.com/documentation/altium-365/management-specific-project#SAMPYM
    structured_aliases:
      - literal_form: Build Package
        predicate: RELATED_SYNONYM
        contexts: [altium-365]
        source: https://www.altium.com/documentation/altium-365/viewers/manufacturing-package-viewer
    attributes:
      des_ManufacturingPackage_projectRelease:
        is_a: core_derivedFrom
        slot_uri: des:ManufacturingPackage_projectRelease
        alias: projectRelease
        title: project release
        description: Manufacturing Packages are created based on a specific Project Release.
        range: des_ProjectRelease
        required: true
        multivalued: false

  des_RuleCheck:
    is_a: core_Artifact
    in_subset: design
    class_uri: des:RuleCheck
    title: Rule Check
    description: Rule check definitions that can be executed against a project to validate design integrity and compliance with specified constraints.
    annotations:
      grid: grid:workspace:{workspace-id}:design:rule-check/{id}
      platformAPI: RuleCheck
      maturity: EXPERIMENTAL

  des_RuleCheckExecution:
    is_a: core_Activity
    in_subset: design
    class_uri: des:RuleCheckExecution
    title: Rule Check Execution
    description: Execution of a rule check against a project to validate design integrity and compliance with specified constraints.
    annotations:
      grid: grid:workspace:{workspace-id}:design:rule-check-execution/{id}
      platformAPI: RuleCheckExecution
      maturity: EXPERIMENTAL


  # ---------------------------------------------------------------------------------------------------------------
  # Design content (compiled design). EXPERIMENTAL draft, refresh of pull request 23 (UDM modelling).
  # Models the compiled, connectivity-level view of a design (what agents read), not the drawing.
  # ---------------------------------------------------------------------------------------------------------------

  des_CompiledDesign:
    is_a: core_Resource
    in_subset: design
    class_uri: des:CompiledDesign
    title: Compiled Design
    description: >-
      The compiled, connectivity-level view of a design project at one revision: its schematic sheets, the
      components placed on them, their pins and the nets that connect those pins, resolved across the sheet
      hierarchy. It is what is read when the logical design is analysed, as opposed to the drawing objects that are
      edited in the schematic editor. It is identified by its project and revision.
    comments:
      - Refresh of pull request 23 (UDM modelling). Open question Q1 is whether this should be a Resource of the project
        (as here), an Artifact, or part of a new project revision class.
      - Design data is only available for revisions where design data generation has run.
    aliases:
      - design data
      - unified data model
    annotations:
      platformAPI: DesignData_Preview
      adSDK: EDP.IProject
      maturity: EXPERIMENTAL
    attributes:
      des_CompiledDesign_project:
        slot_uri: des:CompiledDesign_project
        alias: project
        title: project
        description: The design project this compiled design belongs to.
        range: des_Project
        required: true
        multivalued: false
      des_CompiledDesign_revisionId:
        slot_uri: des:CompiledDesign_revisionId
        alias: revisionId
        title: revision ID
        description: The version-control revision of the project that was compiled.
        range: string
        required: true
        multivalued: false
      des_CompiledDesign_sheets:
        slot_uri: des:CompiledDesign_sheets
        alias: sheets
        title: sheets
        description: The root schematic sheets of the design; sub-sheets are reached through their parents.
        range: des_SchematicSheet
        multivalued: true
        required: false
      des_CompiledDesign_components:
        slot_uri: des:CompiledDesign_components
        alias: components
        title: components
        description: All components placed in the design.
        range: des_PlacedComponent
        multivalued: true
        required: false
      des_CompiledDesign_nets:
        slot_uri: des:CompiledDesign_nets
        alias: nets
        title: nets
        description: All nets of the design, power and signal, resolved across sheets.
        range: des_Net
        multivalued: true
        required: false
      des_CompiledDesign_netClasses:
        slot_uri: des:CompiledDesign_netClasses
        alias: netClasses
        title: net classes
        description: The net classes defined in the design.
        range: des_NetClass
        multivalued: true
        required: false
      des_CompiledDesign_variations:
        slot_uri: des:CompiledDesign_variations
        alias: variations
        title: variations
        description: Per-component variations defined by the project variants.
        range: des_VariantVariation
        multivalued: true
        required: false
      des_CompiledDesign_boards:
        slot_uri: des:CompiledDesign_boards
        alias: boards
        title: boards
        description: The PCB layouts of the project at this revision.
        range: des_PcbLayout
        required: false
        multivalued: true

  des_SchematicSheet:
    is_a: core_Resource
    in_subset: design
    class_uri: des:SchematicSheet
    title: Schematic Sheet
    description: >-
      A schematic document of the design. Sheets form a hierarchy: a sheet can reference sub-sheets, and a repeated
      (multi-channel) sub-sheet appears under each parent that references it.
    aliases:
      - schematic document
    annotations:
      platformAPI: DesignDataSchematicDocument_Preview
      adSDK: EDP.IDocument, SCH.ISch_Sheet
      maturity: EXPERIMENTAL
    attributes:
      des_SchematicSheet_documentId:
        slot_uri: des:SchematicSheet_documentId
        alias: documentId
        title: document ID
        description: Stable identifier of the sheet within the project.
        range: string
        required: true
        multivalued: false
      des_SchematicSheet_fileName:
        slot_uri: des:SchematicSheet_fileName
        alias: fileName
        title: file name
        description: File name of the sheet, e.g. MCU.SchDoc.
        range: string
        multivalued: false
        required: false
      des_SchematicSheet_children:
        slot_uri: des:SchematicSheet_children
        alias: children
        title: children
        description: Sub-sheets referenced from this sheet.
        range: des_SchematicSheet
        multivalued: true
        required: false
      des_SchematicSheet_width:
        slot_uri: des:SchematicSheet_width
        alias: width
        title: width
        description: The sheet width, in millimetres. Not served by the Platform API; AD SDK ISch_Document.SheetSizeX.
        range: decimal
        required: false
        multivalued: false
      des_SchematicSheet_height:
        slot_uri: des:SchematicSheet_height
        alias: height
        title: height
        description: The sheet height, in millimetres. Not served by the Platform API; AD SDK ISch_Document.SheetSizeY.
        range: decimal
        required: false
        multivalued: false

  des_PlacedComponent:
    is_a: core_Resource
    in_subset: design
    class_uri: des:PlacedComponent
    title: Placed Component
    description: >-
      A component instance placed in the design, identified by its designator. When the design uses managed
      components, it is derived from a library component revision; when it uses a file-based library, there is no
      Workspace library item to follow and only its parameters (for example manufacturer and part number) describe it.
    comments:
      - Replaces udm_DesignComponent and des_design_component from pull request 23.
    aliases:
      - component instance
    annotations:
      platformAPI: DesignDataComponent_Preview
      adSDK: EDP.IComponent, SCH.ISch_Component
      maturity: EXPERIMENTAL
    attributes:
      des_PlacedComponent_uniqueId:
        slot_uri: des:PlacedComponent_uniqueId
        alias: uniqueId
        title: unique ID
        description: Identifier of the placed component, unique within the design.
        range: string
        multivalued: false
        required: false
      des_PlacedComponent_logicalDesignator:
        slot_uri: des:PlacedComponent_logicalDesignator
        alias: logicalDesignator
        title: logical designator
        description: The designator as placed on the schematic, e.g. U3.
        range: string
        required: true
        multivalued: false
      des_PlacedComponent_physicalDesignator:
        slot_uri: des:PlacedComponent_physicalDesignator
        alias: physicalDesignator
        title: physical designator
        description: The designator after multi-channel annotation, e.g. U3_CH1.
        range: string
        multivalued: false
        required: false
      des_PlacedComponent_sheet:
        slot_uri: des:PlacedComponent_sheet
        alias: sheet
        title: sheet
        description: The sheet the component is placed on.
        range: des_SchematicSheet
        multivalued: false
        required: false
      des_PlacedComponent_parts:
        slot_uri: des:PlacedComponent_parts
        alias: parts
        title: parts
        description: The parts (sections) of a multi-part component; a single-part component has one.
        range: des_ComponentPart
        multivalued: true
        required: false
      des_PlacedComponent_parameters:
        slot_uri: des:PlacedComponent_parameters
        alias: parameters
        title: parameters
        description: Name/value parameters of the placed component.
        range: des_DesignParameter
        multivalued: true
        required: false
      des_PlacedComponent_librarySource:
        slot_uri: des:PlacedComponent_librarySource
        alias: librarySource
        title: library source
        description: The library component revision this placed component was taken from, when it is a managed component.
        range: lib_ComponentRevision
        multivalued: false
        required: false
      des_PlacedComponent_librarySourceKind:
        slot_uri: des:PlacedComponent_librarySourceKind
        alias: librarySourceKind
        title: library source kind
        description: Whether the component comes from a managed Workspace library or a file-based library.
        range: des_LibrarySourceKind
        multivalued: false
        required: false
      des_PlacedComponent_location:
        slot_uri: des:PlacedComponent_location
        alias: location
        title: location
        description: The location on its schematic sheet.
        range: des_Point2D
        required: false
        multivalued: false
      des_PlacedComponent_boundingBox:
        slot_uri: des:PlacedComponent_boundingBox
        alias: boundingBox
        title: bounding box
        description: The bounding box on its schematic sheet.
        range: des_Rectangle2D
        required: false
        multivalued: false

  des_ComponentPart:
    is_a: core_Resource
    in_subset: design
    class_uri: des:ComponentPart
    title: Component Part
    description: >-
      One part (section) of a placed component. Multi-part components, such as a quad op-amp, are drawn as several
      parts that may sit on different sheets; each part carries a subset of the component's pins.
    annotations:
      platformAPI: DesignDataPart_Preview
      adSDK: EDP.IPart
      maturity: EXPERIMENTAL
    attributes:
      des_ComponentPart_uniqueId:
        slot_uri: des:ComponentPart_uniqueId
        alias: uniqueId
        title: unique ID
        description: Identifier of the part, unique within the design.
        range: string
        multivalued: false
        required: false
      des_ComponentPart_sheet:
        slot_uri: des:ComponentPart_sheet
        alias: sheet
        title: sheet
        description: The sheet the part is drawn on.
        range: des_SchematicSheet
        multivalued: false
        required: false
      des_ComponentPart_pins:
        slot_uri: des:ComponentPart_pins
        alias: pins
        title: pins
        description: The pins of this part.
        range: des_PinInstance
        multivalued: true
        required: false
      des_ComponentPart_location:
        slot_uri: des:ComponentPart_location
        alias: location
        title: location
        description: The location on its schematic sheet.
        range: des_Point2D
        required: false
        multivalued: false
      des_ComponentPart_boundingBox:
        slot_uri: des:ComponentPart_boundingBox
        alias: boundingBox
        title: bounding box
        description: The bounding box on its schematic sheet.
        range: des_Rectangle2D
        required: false
        multivalued: false

  des_PinInstance:
    is_a: core_Resource
    in_subset: design
    class_uri: des:PinInstance
    title: Pin Instance
    description: >-
      A pin of a placed component in the design. It takes its number, name and electrical type from the library pin
      definition and is connected to at most one net.
    comments:
      - Replaces udm_DesignPin and des_design_pin from pull request 23.
    annotations:
      platformAPI: DesignDataPin_Preview
      adSDK: EDP.INetItem, SCH.ISch_Pin
      maturity: EXPERIMENTAL
    attributes:
      des_PinInstance_number:
        slot_uri: des:PinInstance_number
        alias: number
        title: number
        description: Pin number, e.g. 14 or A3.
        range: string
        required: true
        multivalued: false
      des_PinInstance_name:
        slot_uri: des:PinInstance_name
        alias: name
        title: name
        description: Pin name, e.g. PA5.
        range: string
        multivalued: false
        required: false
      des_PinInstance_electricalType:
        slot_uri: des:PinInstance_electricalType
        alias: electricalType
        title: electrical type
        description: Electrical type of the pin, used by electrical rule checks.
        range: lib_PinElectricalType
        multivalued: false
        required: false
      des_PinInstance_functions:
        slot_uri: des:PinInstance_functions
        alias: functions
        title: functions
        description: Alternate functions the pin can serve.
        range: string
        multivalued: true
        required: false
      des_PinInstance_definedBy:
        slot_uri: des:PinInstance_definedBy
        alias: definedBy
        title: defined by
        description: The library pin definition this pin instance comes from, when the component is managed.
        range: lib_Pin
        multivalued: false
        required: false
      des_PinInstance_location:
        slot_uri: des:PinInstance_location
        alias: location
        title: location
        description: The location on its schematic sheet.
        range: des_Point2D
        required: false
        multivalued: false
      des_PinInstance_boundingBox:
        slot_uri: des:PinInstance_boundingBox
        alias: boundingBox
        title: bounding box
        description: The bounding box on its schematic sheet.
        range: des_Rectangle2D
        required: false
        multivalued: false

  des_Net:
    is_a: core_Resource
    in_subset: design
    class_uri: des:Net
    title: Net
    description: >-
      An electrical net of the compiled design: a set of component pins that are electrically connected, resolved
      across the sheet hierarchy. Its scope says whether it is local to one sheet, part of a sheet interface or global.
      Net names are not necessarily unique.
    comments:
      - Replaces udm_DesignNet and des_design_net from pull request 23; nets are design-wide rather than per sheet.
      - Open question Q2 is which relation from the relation dictionary (if any) expresses that a net connects pins.
    annotations:
      platformAPI: DesignDataNet_Preview
      adSDK: EDP.INet
      maturity: EXPERIMENTAL
    attributes:
      des_Net_name:
        slot_uri: des:Net_name
        alias: name
        title: name
        description: Net name, e.g. GND or SPI1_CLK.
        range: string
        required: true
        multivalued: false
      des_Net_scope:
        slot_uri: des:Net_scope
        alias: scope
        title: scope
        description: Whether the net is local to a sheet, a sheet interface, or global.
        range: des_NetScope
        multivalued: false
        required: false
      des_Net_isPower:
        slot_uri: des:Net_isPower
        alias: isPower
        title: is power
        description: True when the net carries power, including ground.
        range: boolean
        multivalued: false
        required: false
      des_Net_connects:
        slot_uri: des:Net_connects
        alias: connects
        title: connects
        description: The component pins connected by this net.
        range: des_PinInstance
        multivalued: true
        required: false
      des_Net_netItems:
        slot_uri: des:Net_netItems
        alias: netItems
        title: net items
        description: The connection objects that make up the net, such as net labels, ports, sheet entries and power objects.
        range: des_NetItem
        multivalued: true
        required: false
      des_Net_netClasses:
        slot_uri: des:Net_netClasses
        alias: netClasses
        title: net classes
        description: The net classes this net belongs to.
        range: des_NetClass
        multivalued: true
        required: false
      des_Net_differentialPair:
        slot_uri: des:Net_differentialPair
        alias: differentialPair
        title: differential pair
        description: The differential pair this net is one side of, if any.
        range: des_DifferentialPair
        multivalued: false
        required: false
      des_Net_wires:
        slot_uri: des:Net_wires
        alias: wires
        title: wires
