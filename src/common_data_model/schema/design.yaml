id: https://w3id.org/altium/cdm/design/
name: cdm-design
prefixes:
  linkml: https://w3id.org/linkml/
  des: https://w3id.org/altium/cdm/design/

imports:
  - linkml:types

default_range: string
default_prefix: des

subsets:
  design:
    title: Design
    description: >-
      Models design projects stored in a Workspace, including multi-board and harness projects, with their
      parameters, variants and releases, the manufacturing packages shared from releases, project templates
      with their revisions, rule checks run against projects, and design reviews of projects. It corresponds to Workspace projects in
      Altium 365 and Altium Designer, from project creation through to design release.
    see_also:
      - https://www.altium.com/documentation/altium-365/workspace-projects
      - https://www.altium.com/documentation/altium-365/management-specific-project
      - https://www.altium.com/documentation/altium-designer/preparing-for-manufacture/design-release
    annotations:
      style: "fill:#93c47d"

classes:

  des_Project:
    is_a: core_Activity
    in_subset: design 
    class_uri: des:Project
    title: Hardware Project
    description: >-
      A design project stored in a Workspace, normally under its built-in version control, such as a PCB project. It
      groups the design documents that together define one implementation of a product, along with its project
      parameters and variants; it is the source from which releases are made and from which Managed BOMs can be
      created.
    aliases:
      - PCB Project
    mixins:
      - plt_SolutionItem
    annotations:
      grid: grid:workspace:{workspace-id}:design:project/{id}
      platformAPI: DesProject
    see_also:
      - https://www.altium.com/documentation/altium-365/workspace-projects
      - https://www.altium.com/documentation/altium-designer/creating-projects-documents
    structured_aliases:
      - literal_form: Workspace project
        predicate: EXACT_SYNONYM
        contexts: [altium-365, altium-designer]
        source: https://www.altium.com/documentation/altium-365/workspace-projects
      - literal_form: design project
        predicate: RELATED_SYNONYM
        contexts: [altium-designer, altium-365]
        source: https://www.altium.com/documentation/altium-designer/creating-projects-documents
    attributes:
      des_Project_parameters:
        slot_uri: des:Project_parameters
        alias: parameters
        title: parameters
        description: TBD
        range: des_ProjectParameter
        multivalued: true
        required: false
      des_Project_variants:
        slot_uri: des:Project_variants
        alias: variants
        title: variants
        description: TBD
        range: des_ProjectVariant
        multivalued: true
        required: false
    slots:
      - core_releases
      - lib_uses_parts
      - lib_uses_components
    slot_usage:
      core_releases:
        range: des_ProjectRelease

  des_ProjectParameter:
    is_a: core_Resource
    in_subset: design
    class_uri: des:ProjectParameter
    title: Project Parameter
    description: >-
      A name/value parameter defined at the level of a design project. It is either a Workspace-side (server-side)
      parameter, kept with the project in the Workspace and editable only there, or a design-side parameter, kept in
      the project file (e.g. *.PrjPcb) and editable in Altium Designer. Both kinds appear in the project options and can be
      used as special strings in design documents.
    annotations:
      platformAPI: DesProjectParameter
    see_also:
      - https://www.altium.com/documentation/altium-365/workspace-projects#project_parameters
      - https://www.altium.com/documentation/altium-designer/accessing-defining-managing-project-options#parameters
    attributes:
      des_ProjectParameter_name:
        slot_uri: des:ProjectParameter_name
        alias: name
        title: name
        description: TBD
        range: string
        multivalued: false
        required: true
      des_ProjectParameter_value:
        slot_uri: des:ProjectParameter_value
        alias: value
        title: value
        description: TBD
        range: string
        multivalued: false
        required: false

  des_ProjectVariant:
    is_a: core_Resource
    in_subset: design 
    class_uri: des:ProjectVariant
    title: Hardware Project Variant
    description: >-
      A design variant of a project: a named variation of the same base design that is assembled with a different set
      of components. Within a variant, each component can be fitted, not fitted, fitted with varied parameters, or
      replaced by an alternate part, and the variant can define its own variant-level parameters. Assembly variants
      share one bare board, whereas fabrication variants also change overlay information and so need a different board.
    annotations:
      platformAPI: DesWipVariant
    see_also:
      - https://www.altium.com/documentation/altium-designer/design-variants
      - https://www.altium.com/documentation/altium-designer/variant-manager
    structured_aliases:
      - literal_form: design variant
        predicate: EXACT_SYNONYM
        contexts: [altium-designer]
        source: https://www.altium.com/documentation/altium-designer/design-variants

  des_MultiboardProject:
    is_a: des_Project
    in_subset: design 
    class_uri: des:MultiboardProject
    title: Multiboard Project
    description: 
      Multiboard Project represents the coordinated design of multiple interconnected PCB projects assembled into a single system, 
      capturing both their logical interconnects and physical arrangements.
    comments:
      - Multiboard Project serves as an aggregate that composes individual board Projects into a higher-level system entity, 
        maintaining identity and traceability across design boundaries. It enables engineers to define harnesses, connectors, and 
        mechanical fit at the system level, while preserving the autonomy of each board design, thus supporting codesign, simulation, 
        and integration workflows across ECAD and MCAD domains.
    annotations:
      platformAPI: DesProject
    see_also:
      - https://www.altium.com/documentation/altium-designer/multi-board-design#structure_multi_board_design_project
    attributes:
      des_MultiboardProject_projects:
        is_a: core_hasPart
        slot_uri: des:MultiboardProject_projects
        alias: projects
        title: projects
        description: The individual PCB projects that make up this Multiboard Project.
        range: des_Project
        multivalued: true
        required: false

  des_HarnessProject:
    is_a: des_Project
    in_subset: design 
    class_uri: des:HarnessProject
    title: Harness Project
    description: 
      Harness Project defines the design of a cable and wiring harness as a standalone yet integrable artifact, capturing connectors, 
      wires, splices, and pin-to-pin mappings required to implement electrical interconnects between boards and system elements. 
    comments:
      - Harness Project provides a structured representation of connectivity at the physical wiring level, complementing schematic and 
        PCB projects while maintaining its own lifecycle and identity. It enables engineers to design, document, and validate interconnects 
        in a way that is traceable, manufacturable, and tightly integrated with Multiboard and MCAD workflows within the Altium ecosystem.
    annotations:
      platformAPI: DesProject
    see_also:
      - https://www.altium.com/documentation/altium-designer/harness-design

  des_ProjectRelease:
    is_a: core_Artifact
    in_subset: design 
    class_uri: des:ProjectRelease
    title: Hardware Project Release
    description: 
      Project Release captures an immutable snapshot of a PCB design project at a specific point in its lifecycle, packaging all design data, 
      outputs, and metadata required for manufacturing, assembly, and downstream processes. 
    comments:
      - Project Release serves as the authoritative artifact that bridges design and production, ensuring repeatability, traceability, and regulatory compliance. 
        Its identity is tied to the originating Project but remains stable as a versioned deliverable, enabling teams to collaborate confidently, audit changes, 
        and integrate with supply chain and PLM systems through Altium 365 and related workflows.
    annotations:
      grid: grid:workspace:{workspace-id}:design:project-release/{id}
      platformAPI: DesRelease
    see_also:
      - https://www.altium.com/documentation/altium-designer/preparing-for-manufacture/design-release
      - https://www.altium.com/documentation/altium-designer/preparing-for-manufacture/design-release/workspace
    structured_aliases:
      - literal_form: design project release
        predicate: RELATED_SYNONYM
        contexts: [altium-designer]
        source: https://www.altium.com/documentation/altium-designer/preparing-for-manufacture/design-release
    mixins:
      - plt_HasLifecycle
    slots:
      - lib_consists_of_components

  des_ProjectTemplate:
    is_a: core_Artifact
    in_subset: design 
    class_uri: des:ProjectTemplate
    title: Project Template
    description: >-
      A reusable starting point for new design projects that bundles the documents, files and project settings a team
      wants to apply again and again. A project created from a template receives the template's documents and its
      project options.
    comments:
      - Besides the usual project documents, a template may carry reference documentation, configuration files and
        Output Jobs, together with agreed project and document settings such as design rules, parameters, title blocks
        and release options.
      - Templates are available for PCB, multi-board and harness projects. A Workspace project template is kept as a
        series of revisions; saving an edited template creates its next revision, and new projects are based on the
        latest revisions shared with the user.
    annotations:
      grid: grid:workspace:{workspace-id}:design:project-template/{id}
      platformAPI: DesProjectTemplate
    see_also:
      - https://www.altium.com/documentation/altium-designer/creating-project-template
    slots:
      - core_revisions
    slot_usage:
      core_revisions:
        range: des_ProjectTemplateRevision

  des_ProjectTemplateRevision:
    is_a: core_Artifact
    in_subset: design 
    class_uri: des:ProjectTemplateRevision
    title: Project Template Revision
    description: >-
      An immutable revision of a project template.
    annotations:
      grid: grid:workspace:{workspace-id}:design:project-template-revision/{id}
      platformAPI: DesProjectTemplateRevision
    mixins:
      - plt_HasLifecycle

  des_ManufacturingPackage:
    is_a: core_Artifact
    in_subset: design 
    class_uri: des:ManufacturingPackage
    title: Manufacturing Package
    description: >-
      A read-only package that contains a subset of Project Release artifacts that is typically shared with an external party for the purposes 
      of manufacturing the board (e.g. Manufacturing Package may contain fabrication/assembly files required by the factories, but not the sources of the project)
    annotations:
      grid: grid:workspace:{workspace-id}:design:manufacturing-package/{id}
    see_also:
      - https://www.altium.com/documentation/altium-365/viewers/manufacturing-package-viewer
      - https://www.altium.com/documentation/altium-365/management-specific-project#SAMPYM
    structured_aliases:
      - literal_form: Build Package
        predicate: RELATED_SYNONYM
        contexts: [altium-365]
        source: https://www.altium.com/documentation/altium-365/viewers/manufacturing-package-viewer
    attributes:
      des_ManufacturingPackage_projectRelease:
        is_a: core_derivedFrom
        slot_uri: des:ManufacturingPackage_projectRelease
        alias: projectRelease
        title: project release
        description: Manufacturing Packages are created based on a specific Project Release.
        range: des_ProjectRelease
        required: true
        multivalued: false

  des_RuleCheck:
    is_a: core_Artifact
    in_subset: design
    class_uri: des:RuleCheck
    title: Rule Check
    description: Rule check definitions that can be executed against a project to validate design integrity and compliance with specified constraints.
    annotations:
      grid: grid:workspace:{workspace-id}:design:rule-check/{id}
      platformAPI: RuleCheck
      maturity: EXPERIMENTAL

  des_RuleCheckExecution:
    is_a: core_Activity
    in_subset: design
    class_uri: des:RuleCheckExecution
    title: Rule Check Execution
    description: Execution of a rule check against a project to validate design integrity and compliance with specified constraints.
    annotations:
      grid: grid:workspace:{workspace-id}:design:rule-check-execution/{id}
      platformAPI: RuleCheckExecution
      maturity: EXPERIMENTAL

  des_DesignReview:
    is_a: core_Activity
    in_subset: design
    class_uri: des:DesignReview
    title: Design Review
    description: >-
      A structured review of a Workspace design project, carried out on a fixed snapshot of the design: the
      work-in-progress design as it was when the review was created, or a chosen project commit or release (the
      review context). The Workspace member who creates the review (the Initiator) assigns other Workspace members
      as Reviewers. Reviewers work through an optional checklist, comment on the design snapshot, raise tasks and
      approve or reject the design. The Initiator closes the review as Completed or Rejected, or cancels it; a
      closed review can no longer be changed and remains as a traceable compliance record. A project can have many design
      reviews, and each follows a process workflow (the built-in Design Review process or a custom one).
    annotations:
      grid: grid:workspace:{workspace-id}:design:design-review/{id}
    see_also:
      - https://www.altium.com/documentation/altium-365/project-design-reviews
    attributes:
      des_DesignReview_project:
        is_a: core_partOf
        slot_uri: des:DesignReview_project
        alias: project
        title: project
        description: The design project under review.
        range: des_Project
        multivalued: false
        required: true
      des_DesignReview_reviewContext:
        is_a: core_occursIn
        slot_uri: des:DesignReview_reviewContext
        alias: reviewContext
        title: review context
        description: >-
          The project release under review, when the review context is a release. Absent when the review applies
          to a snapshot of the work-in-progress design or to a project commit, which are not modelled yet.
        range: des_ProjectRelease
        multivalued: false
        required: false
      des_DesignReview_initiator:
        slot_uri: des:DesignReview_initiator
        alias: initiator
        title: initiator
        description: >-
          The Workspace member who created the review. Only the Initiator or a Workspace administrator can
          finalize it.
        range: plt_WorkspaceUser
        inlined: false
        multivalued: false
        required: true
      des_DesignReview_reviewers:
        slot_uri: des:DesignReview_reviewers
        alias: reviewers
        title: reviewers
        description: >-
          The Workspace members asked to review the design. Each must have access to the project, and a review
          task is created for each of them.
        range: plt_WorkspaceUser
        inlined: false
        multivalued: true
        required: false
      des_DesignReview_workflow:
        is_a: core_informedBy
        slot_uri: des:DesignReview_workflow
        alias: workflow
        title: workflow
        description: >-
          The process workflow that the review follows: the built-in Design Review process or a custom design
          review process.
        range: cus_Workflow
        multivalued: false
        required: false
      des_DesignReview_tasks:
        is_a: core_informs
        slot_uri: des:DesignReview_tasks
        alias: tasks
        title: tasks
        description: >-
          Tasks of the review: the process tasks created for the Initiator and the Reviewers, and tasks raised
          from comments placed on the design snapshot.
        range: col_Task
        multivalued: true
        required: false
      des_DesignReview_commentThreads:
        is_a: core_hasPart
        slot_uri: des:DesignReview_commentThreads
        alias: commentThreads
        title: comment threads
        description: >-
          Comment threads placed on the design snapshot of the review, including those about checklist items.
        range: col_CommentThread
        multivalued: true
        required: false
      des_DesignReview_status:
        slot_uri: des:DesignReview_status
        alias: status
        title: status
        description: The state of the review, from In Progress to its closed state.
        range: des_DesignReviewStatus
        multivalued: false
        required: true

enums:

  des_DesignReviewStatus:
    is_a: Enumeration
    in_subset: design
    enum_uri: des:DesignReviewStatus
    title: Design Review Status
    description: The state of a design review.
    implements:
      - owl:NamedIndividual
    permissible_values:
      InProgress:
        description: The review is open; Reviewers can complete their tasks.
      Completed:
        description: The Initiator closed the review as completed; it can no longer be changed.
      Rejected:
        description: The Initiator closed the review as rejected; it can no longer be changed.
      Cancelled:
        description: >-
          The Initiator or a Reviewer cancelled the review; its tasks are resolved and it can no longer be changed.

slots:
