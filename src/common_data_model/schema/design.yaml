slots:

enums:

  des_NetScope:
    is_a: Enumeration
    in_subset: design
    enum_uri: des:NetScope
    title: Net Scope
    description: How far a net reaches in the sheet hierarchy.
    implements:
      - owl:NamedIndividual
    permissible_values:
      Local:
        description: The net exists on one sheet only.
      SheetInterface:
        description: The net connects a sheet to its parent through ports or sheet entries.
      Global:
        description: The net is global to the design, e.g. a power net.
      Unknown:
        description: The scope could not be determined.

  des_NetItemKind:
    is_a: Enumeration
    in_subset: design
    enum_uri: des:NetItemKind
    title: Net Item Kind
    description: The kind of connection object that contributes to a net.
    implements:
      - owl:NamedIndividual
    permissible_values:
      Pin:
        description: A component pin.
      SheetEntry:
        description: A sheet entry on a sheet symbol.
      NetLabel:
        description: A net label.
      Port:
        description: A sheet port.
      PowerObject:
        description: A power port object, such as GND or VCC.

  des_ComponentVariationKind:
    is_a: Enumeration
    in_subset: design
    enum_uri: des:ComponentVariationKind
    title: Component Variation Kind
    description: How a placed component varies in a project variant.
    implements:
      - owl:NamedIndividual
    permissible_values:
      NotFitted:
        description: The component is not assembled in this variant.
      Alternate:
        description: An alternate component is used in this variant.

  des_LibrarySourceKind:
    is_a: Enumeration
    in_subset: design
    enum_uri: des:LibrarySourceKind
    title: Library Source Kind
    description: Where a placed component was taken from.
    implements:
      - owl:NamedIndividual
    permissible_values:
      Managed:
        description: A managed component from the Workspace library, traceable to a component revision.
      FileLibrary:
        description: A component from a file-based library (for example a SchLib), with no Workspace library item.
      Unknown:
        description: The source could not be determined.

  des_LayerType:
    is_a: Enumeration
    in_subset: design
    enum_uri: des:LayerType
    title: Layer Type
    description: The kind of a board layer, as classified by the Platform API (DesLayerType).
    annotations:
      platformAPI: DesLayerType
    implements:
    - owl:NamedIndividual
    permissible_values:
      Abstract:
        description: Platform API ABSTRACT.
      Adhesive:
        description: Platform API ADHESIVE.
      BikiniCoverlay:
        description: Platform API BIKINI_COVERLAY.
      Conductive:
        description: Platform API CONDUCTIVE.
      Core:
        description: Platform API CORE.
      Dielectric:
        description: Platform API DIELECTRIC.
      Foil:
        description: Platform API FOIL.
      Mechanical:
        description: Platform API MECHANICAL.
      Misc:
        description: Platform API MISC.
      NonConductive:
        description: Platform API NON_CONDUCTIVE.
      Overlay:
        description: Platform API OVERLAY.
      PasteMask:
        description: Platform API PASTE_MASK.
      PeLayer:
        description: Platform API PE_LAYER.
      Physical:
        description: Platform API PHYSICAL.
      Plane:
        description: Platform API PLANE.
      Plating:
        description: Platform API PLATING.
      Prepreg:
        description: Platform API PREPREG.
      Signal:
        description: Platform API SIGNAL.
      SolderMask:
        description: Platform API SOLDER_MASK.
      Stiffener:
        description: Platform API STIFFENER.
      SurfaceFinish:
        description: Platform API SURFACE_FINISH.
      Unknown:
        description: Platform API UNKNOWN.

  des_PadType:
    is_a: Enumeration
    in_subset: design
    enum_uri: des:PadType
    title: Pad Type
    description: 'Whether a pad is surface-mount or free (Platform API DesPadType: "Pad type: SMD or free.").'
    annotations:
      platformAPI: DesPadType
    implements:
    - owl:NamedIndividual
    permissible_values:
      Smd:
        description: Platform API SMD.
      Free:
        description: Platform API FREE.

  des_PrimitiveShape:
    is_a: Enumeration
    in_subset: design
    enum_uri: des:PrimitiveShape
    title: Primitive Shape
    description: The shape of a pad or via (Platform API DesPrimitiveShape).
    annotations:
      platformAPI: DesPrimitiveShape
      adSDK: PCB.TShape
    implements:
    - owl:NamedIndividual
    permissible_values:
      None:
        description: Platform API NONE. AD SDK TShape.eNoShape (matched by name, [interpretation]).
      Round:
        description: Platform API ROUND. AD SDK TShape.eRounded (matched by name, [interpretation]).
      Rectangle:
        description: Platform API RECTANGLE. AD SDK TShape.eRectangular (matched by name, [interpretation]).
      Octagon:
        description: Platform API OCTAGON. AD SDK TShape.eOctagonal (matched by name, [interpretation]).
      Circle:
        description: Platform API CIRCLE. AD SDK TShape.eCircleShape (matched by name, [interpretation]).
      Arc:
        description: Platform API ARC. AD SDK TShape.eArcShape (matched by name, [interpretation]).
      Terminator:
        description: Platform API TERMINATOR. AD SDK TShape.eTerminator (matched by name, [interpretation]).
      RoundRectangle:
        description: Platform API ROUND_RECTANGLE. AD SDK TShape.eRoundRectShape (matched by name, [interpretation]).
      RotatedRectangle:
        description: Platform API ROTATED_RECTANGLE. AD SDK TShape.eRotatedRectShape (matched by name, [interpretation]).
      RoundedRectangle:
