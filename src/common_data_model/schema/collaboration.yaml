id: https://w3id.org/altium/cdm/collaboration/
name: cdm-collaboration

prefixes:
  linkml: https://w3id.org/linkml/
  col: https://w3id.org/altium/cdm/collaboration/

imports:
  - linkml:types

default_range: string
default_prefix: col

subsets:
  collaboration:
    title: Collaboration
    description: >-
      Models collaboration on Workspace content: comment threads attached to a point, object or area of a
      document, the individual comments in each thread, tasks that assign work to users or teams, and design
      reviews in which assigned reviewers assess a snapshot of a design project. In the
      product, comments are placed on documents of Workspace projects (e.g. through the Comments and Tasks
      panel in Altium Designer), and tasks are tracked on the Tasks page of a Workspace.
    see_also:
      - https://www.altium.com/documentation/altium-designer/document-commenting
      - https://www.altium.com/documentation/altium-365/tasks
      - https://www.altium.com/documentation/altium-developer-center/altium-365/api#how_the_api_is_organized
    annotations:
      style: "fill:#6fa8dc"

classes:

  col_Task:
    is_a: core_Activity
    in_subset: collaboration 
    class_uri: col:Task
    title: Task
    description: >-
      Task represents a discrete unit of work assigned to a user or team within the design workflow, 
      used to track progress, responsibility, and completion status for design, review, or management activities.
    comments:
      - Each Task has its own identity, state, and assignees, and may be linked to specific design objects, projects, or comments.  
      - It provides structure and accountability in collaborative design processes, supporting review cycles, issue resolution, 
        and workflow coordination across teams within Altium 365.
    annotations:
      grid: grid:workspace:{workspace-id}:collaboration:task/{id}
      platformAPI: DesTask
    see_also:
      - https://www.altium.com/documentation/altium-365/tasks

  col_CommentThread:
    is_a: core_Activity
    in_subset: collaboration
    class_uri: col:CommentThread
    title: Comment Thread
    description: >-
      Comment Thread represents a structured discussion linked to a specific design object, document, or workspace item, 
      capturing feedback, decisions, and context directly within the collaborative design environment.
    comments:
      - Each Comment Thread has its own identity and lifecycle, grouping related comments and replies into a coherent conversation. 
      - It serves as a persistent communication artifact that promotes design review transparency, traceability, and cross-team collaboration 
        within Altium 365 and connected design tools.
    annotations:
      grid: grid:workspace:{workspace-id}:collaboration:comment-thread/{id}
      platformAPI: DesCommentThread
    see_also:
      - https://www.altium.com/documentation/altium-365/viewers/web-viewer#commenting
      - https://www.altium.com/documentation/altium-designer/document-commenting
    attributes:
      col_CommentThread_comments:
        slot_uri: col:CommentThread_comments
        alias: comments
        title: comments
        description: TBD
        range: col_Comment
        required: true
        multivalued: true

  col_Comment:
    is_a: core_Resource
    in_subset: collaboration
    class_uri: col:Comment
    title: Comment
    description: >-
      A single entry in a comment thread: either the initial comment, pinned to a point, an object or an area
      of a design document (or to a BOM line), or a reply to it. A comment can mention people or groups using @,
      and it can be assigned to a Workspace member as a task, either when it is posted or later by converting it.
      Only the author can edit or delete a comment, and deleting the initial comment also deletes its replies.
    annotations:
      platformAPI: DesComment
    see_also:
      - https://www.altium.com/documentation/altium-365/viewers/web-viewer#comment_placement

  col_DesignReview:
    is_a: core_Activity
    in_subset: collaboration
    class_uri: col:DesignReview
    title: Design Review
    description: >-
      A structured assessment of a design project, carried out by assigned Reviewers on a fixed snapshot of its
      design and concluded by the Initiator's decision, which leaves a traceable record of the review.
    annotations:
      grid: grid:workspace:{workspace-id}:collaboration:design-review/{id}
    see_also:
      - https://www.altium.com/documentation/altium-365/project-design-reviews
    attributes:
      col_DesignReview_project:
        is_a: core_partOf
        slot_uri: col:DesignReview_project
        alias: project
        title: project
        description: The design project under review.
        range: des_Project
        multivalued: false
        required: true
      col_DesignReview_reviewContext:
        is_a: core_occursIn
        slot_uri: col:DesignReview_reviewContext
        alias: reviewContext
        title: review context
        description: >-
          The project release under review, when the review context is a release. Absent when the review applies
          to a snapshot of the work-in-progress design or to a project commit, which are not modelled yet.
        range: des_ProjectRelease
        multivalued: false
        required: false
      col_DesignReview_initiator:
        slot_uri: col:DesignReview_initiator
        alias: initiator
        title: initiator
        description: >-
          The Workspace member who created the review. Only the Initiator or a Workspace administrator can
          finalize it.
        range: plt_WorkspaceUser
        inlined: false
        multivalued: false
        required: true
      col_DesignReview_reviewers:
        slot_uri: col:DesignReview_reviewers
        alias: reviewers
        title: reviewers
        description: >-
          The Workspace members asked to review the design. Each must have access to the project, and a review
          task is created for each of them.
        range: plt_WorkspaceUser
        inlined: false
        multivalued: true
        required: false
      col_DesignReview_workflow:
        is_a: core_informedBy
        slot_uri: col:DesignReview_workflow
        alias: workflow
        title: workflow
        description: >-
          The process workflow that the review follows: the built-in Design Review process or a custom design
          review process.
        range: cus_Workflow
        multivalued: false
        required: false
      col_DesignReview_tasks:
        is_a: core_informs
        slot_uri: col:DesignReview_tasks
        alias: tasks
        title: tasks
        description: >-
          Tasks of the review: the process tasks created for the Initiator and the Reviewers, and tasks raised
          from comments placed on the design snapshot.
        range: col_Task
        multivalued: true
        required: false
      col_DesignReview_commentThreads:
        is_a: core_hasPart
        slot_uri: col:DesignReview_commentThreads
        alias: commentThreads
        title: comment threads
        description: >-
          Comment threads placed on the design snapshot of the review, including those about checklist items.
        range: col_CommentThread
        multivalued: true
        required: false
      col_DesignReview_status:
        slot_uri: col:DesignReview_status
        alias: status
        title: status
        description: The state of the review, from In Progress to its closed state.
        range: col_DesignReviewStatus
        multivalued: false
        required: true

enums:

  col_DesignReviewStatus:
    is_a: Enumeration
    in_subset: collaboration
    enum_uri: col:DesignReviewStatus
    title: Design Review Status
    description: The state of a design review.
    implements:
      - owl:NamedIndividual
    permissible_values:
      InProgress:
        description: The review is open; Reviewers can complete their tasks.
      Completed:
        description: The Initiator closed the review as completed; it can no longer be changed.
      Rejected:
        description: The Initiator closed the review as rejected; it can no longer be changed.
      Cancelled:
        description: >-
          The Initiator or a Reviewer cancelled the review; its tasks are resolved and it can no longer be changed.
