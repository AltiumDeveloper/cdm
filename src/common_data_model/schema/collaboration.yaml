id: https://w3id.org/altium/cdm/collaboration
name: cdm-collaboration

prefixes:
  linkml: https://w3id.org/linkml/
  col: https://w3id.org/altium/cdm/collaboration/

imports:
  - linkml:types

default_range: string
default_prefix: col

subsets:
  collaboration:
    description: >-
      Models collaboration on Workspace content: comment threads attached to a point, object or area of a
      document, the individual comments in each thread, and tasks that assign work to users or teams. In the
      product, comments are placed on documents of Workspace projects (e.g. through the Comments and Tasks
      panel in Altium Designer), and tasks are tracked on the Tasks page of a Workspace.
    see_also:
      - https://www.altium.com/documentation/altium-designer/document-commenting
      - https://www.altium.com/documentation/altium-365/tasks
      - https://www.altium.com/documentation/altium-developer-center/altium-365/api#how_the_api_is_organized
    annotations:
      style: "fill:#6fa8dc"

classes:

  col_Task:
    is_a: core_Activity
    in_subset: collaboration 
    class_uri: col:Task
    title: Task
    description: >-
      Task represents a discrete unit of work assigned to a user or team within the design workflow, 
      used to track progress, responsibility, and completion status for design, review, or management activities.
    comments:
      - Each Task has its own identity, state, and assignees, and may be linked to specific design objects, projects, or comments.  
      - It provides structure and accountability in collaborative design processes, supporting review cycles, issue resolution, 
        and workflow coordination across teams within Altium 365.
    annotations:
      grid: grid:workspace:{workspace-id}:collaboration:task/{id}
      platformAPI: DesTask
    see_also:
      - https://www.altium.com/documentation/altium-365/tasks

  col_CommentThread:
    is_a: core_Activity
    in_subset: collaboration
    class_uri: col:CommentThread
    title: Comment Thread
    description: >-
      Comment Thread represents a structured discussion linked to a specific design object, document, or workspace item, 
      capturing feedback, decisions, and context directly within the collaborative design environment.
    comments:
      - Each Comment Thread has its own identity and lifecycle, grouping related comments and replies into a coherent conversation. 
      - It serves as a persistent communication artifact that promotes design review transparency, traceability, and cross-team collaboration 
        within Altium 365 and connected design tools.
    annotations:
      grid: grid:workspace:{workspace-id}:collaboration:comment-thread/{id}
      platformAPI: DesCommentThread
    see_also:
      - https://www.altium.com/documentation/altium-365/viewers/web-viewer#commenting
      - https://www.altium.com/documentation/altium-designer/document-commenting
    attributes:
      col_CommentThread_comments:
        slot_uri: col:CommentThread_comments
        alias: comments
        title: comments
        description: TBD
        range: col_Comment
        required: true
        multivalued: true

  col_Comment:
    is_a: core_Resource
    in_subset: collaboration
    class_uri: col:Comment
    title: Comment
    description: >-
      A single entry in a comment thread: either the initial comment, pinned to a point, an object or an area
      of a design document (or to a BOM line), or a reply to it. A comment can mention people or groups using @,
      and it can be assigned to a Workspace member as a task, either when it is posted or later by converting it.
      Only the author can edit or delete a comment, and deleting the initial comment also deletes its replies.
    annotations:
      platformAPI: DesComment
    see_also:
      - https://www.altium.com/documentation/altium-365/viewers/web-viewer#comment_placement
