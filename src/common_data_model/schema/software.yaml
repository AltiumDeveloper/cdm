id: https://w3id.org/altium/cdm/software/
name: cdm-software
prefixes:
  linkml: https://w3id.org/linkml/
  core: https://w3id.org/altium/cdm/core/
  sft: https://w3id.org/altium/cdm/software/

imports:
  - linkml:types

default_range: string
default_prefix: sft

subsets:
  software:
    description: >- 
      TBD
    annotations:
      style: "fill:#3c78d8"

classes:

  sft_SoftwareProject:
    is_a: Activity
    in_subset: software
    class_uri: sft:SoftwareProject
    title: Software Project
    description: TBD
    annotations:
      grid: grid:workspace:{workspace-id}:software:software-project/{id}
      platformAPI: SftSoftwareProject
    mixins:
      - plt_SolutionItem
    slots:
      - core_releases
    slot_usage:
      core_releases:
        range: sft_SoftwareRelease
    attributes:
      sft_SoftwareProject_aiModels:
        is_a: core_hasInput
        slot_uri: sft:SoftwareProject_aiModels
        alias: aiModels
        title: ai models
        description: TBD
        range: sft_AIModel
        multivalued: false
        required: false
      sft_SoftwareProject_deviceConfiguration:
        is_a: core_hasOutput
        slot_uri: sft:SoftwareProject_deviceConfiguration
        alias: deviceConfiguration
        title: device configuration
        description: Device Configuration derived from the project
        range: sft_DeviceConfiguration
        multivalued: false
        required: false
      sft_SoftwareProject_latestBuildArtifacts:
        is_a: core_hasOutput
        slot_uri: sft:SoftwareProject_latestBuildArtifacts
        alias: latestBuildArtifacts
        title: latest build artifacts
        description: Latest build artifacts produced from the project
        range: sft_BuildArtifact
        multivalued: true
        required: false

  sft_SoftwareRelease:
    is_a: Artifact
    in_subset: software
    class_uri: sft:SoftwareRelease
    title: Software Release
    description: TBD
    annotations:
      grid: grid:workspace:{workspace-id}:software:software-release/{id}
    attributes:
      sft_SoftwareRelease_title:
        alias: title
        slot_uri: sft:SoftwareRelease_title
        title: title
        description: Title of the release
        range: string
        required: false
        multivalued: false
      sft_SoftwareRelease_description:
        alias: description
        slot_uri: sft:SoftwareRelease_description
        title: description
        description: Free form text with additional details about the release. Changelog, etc.
        range: string
        required: false
        multivalued: false
      sft_SoftwareRelease_attachments:
        alias: attachments
        slot_uri: sft:SoftwareRelease_attachments
        title: attachments
        description: Additional files associated with the release (reports, documents, etc.)
        range: BLOB
        required: false
        multivalued: false
      sft_SoftwareRelease_aiModels:
        is_a: core_hasPart
        slot_uri: sft:SoftwareRelease_aiModels
        alias: aiModels
        title: ai models
        description: AI model artifacts included into the release.
        range: sft_AIModel
        multivalued: false
        required: false
      sft_SoftwareRelease_buildArtifacts:
        is_a: core_hasPart
        slot_uri: sft:SoftwareRelease_buildArtifacts
        alias: buildArtifacts
        title: build artifacts
        description: Firmware build artifacts, deployable to the device. May be multiple artifacts if firmware targets multiple chips.
        range: sft_BuildArtifact
        multivalued: true
        required: false

  sft_DeviceConfiguration:
    is_a: Artifact
    in_subset: software
    class_uri: sft:DeviceConfiguration
    title: Device Configuration
    description: TBD
    annotations:
      grid: grid:workspace:{workspace-id}:software:device-configuration/{id}
      platformAPI: SftDevCfgDeviceConfiguration
    slots:
      - core_revisions
    slot_usage:
      core_revisions:
        range: sft_DeviceConfigurationRevision

  sft_DeviceConfigurationRevision:
    is_a: Artifact
    in_subset: software
    class_uri: sft:DeviceConfigurationRevision
    title: Device Configuration Revision
    description: TBD
    annotations:
      grid: grid:workspace:{workspace-id}:software:device-configuration-revision/{id}
      platformAPI: SftDevCfgDeviceConfigurationRevision
    attributes:
      sft_DeviceConfigurationRevision_pinModel:
        slot_uri: sft:DeviceConfigurationRevision_pinModel
        alias: pinModel
        title: pin model
        description: TBD
        range: sft_PinAssignmentModel
        multivalued: false
        required: true
        inlined: true

  sft_PinAssignmentModel:
    is_a: Resource
    in_subset: software
    class_uri: sft:PinAssignmentModel
    title: Device pin assgnment
    description: TBD
    attributes:
      sft_PinAssignmentModel_pins:
        slot_uri: sft:PinAssignmentModel_pins
        alias: pins
        title: pins
        description: TBD
        range: sft_PinAssignment
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true

  sft_PinAssignment:
    is_a: Resource
    in_subset: software
    class_uri: sft:PinAssignment
    title: Device pin assgnment
    description: TBD
    attributes:
      sft_PinAssignment_pinNumber:
        slot_uri: sft:PinAssignment_pinNumber
        alias: pinNumber
        title: pin number
        description: TBD
        range: integer
        multivalued: false
        required: true
      sft_PinAssignment_pinName:
        slot_uri: sft:PinAssignment_pinName
        alias: pinName
        title: pin name
        description: TBD
        range: string
        multivalued: false
        required: true
      sft_PinAssignment_pinFunction:
        slot_uri: sft:PinAssignment_pinFunction
        alias: pinFunction
        title: pin function
        description: TBD
        range: string
        multivalued: false
        required: true
      sft_PinAssignment_symbolicName:
        slot_uri: sft:PinAssignment_symbolicName
        alias: symbolicName
        title: symbolic name
        description: TBD
        range: string
        multivalued: false
        required: true

  sft_AIModel:
    is_a: Artifact
    in_subset: software
    class_uri: sft:AIModel
    title: AI Model
    description: AI model artifact in context of a workspace
    comments:
      - We start with a simple Artifact-like entity without explicit revisions support.
        The assumption is that if we need revisions going forward, we'll add explicit revision entity,
        define GRID for it, relations, etc.
    todos:
      - Data Content Platform would likely define another (but related) AI model entity - the one
        that is going to be part of Solution Template. The exact name / definition of the entity is TBD.
    annotations:
      grid: grid:workspace:{workspace-id}:software:ai-model/{id}
      maturity: EXPERIMENTAL
    mixins:
      - plt_SolutionItem

  sft_BuildArtifact:
    is_a: Artifact
    in_subset: software
    class_uri: sft:BuildArtifact
    title: Build Artifact
    description: TBD
