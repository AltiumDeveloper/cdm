id: https://w3id.org/altium/cdm/procurement/
name: cdm-procurement
prefixes:
  linkml: https://w3id.org/linkml/
  pro: https://w3id.org/altium/cdm/procurement/
  core: https://w3id.org/altium/cdm/core/

imports:
  - linkml:types

default_range: string
default_prefix: pro

subsets:
  procurement:
    description: >-
      Models bills of materials: BOMs kept in a Workspace and worked on in the BOM Portal (managed and
      consolidated BOMs) with their releases, BOMs held on Octopart outside any Workspace (global BOMs), and
      BOM lines with their alternate and substitute parts and the issues found when a BOM is analysed. It
      corresponds to the Altium 365 BOM Portal.
    see_also:
      - https://www.altium.com/documentation/altium-365/bom-portal
    annotations:
      style: "fill:#dd7e6b"

classes:

  ### Mixins

  pro_Bom:
    is_a: core_Meta
    in_subset: procurement
    abstract: true
    mixin: true
    class_uri: pro:Bom
    title: BOM
    description: Bill of Materials
    see_also:
      - https://www.altium.com/documentation/altium-365/bom-portal
    attributes:
      pro_Bom_items:
        slot_uri: pro:Bom_items
        alias: items
        title: items
        description: TBD
        range: pro_BomItem
        required: false
        multivalued: true
    slots:
      - pro_bom_issues

  ### Entities

  pro_BomWIP:
    is_a: core_Activity
    in_subset: procurement
    class_uri: pro:BomWIP
    abstract: true
    title: BOM WIP
    description: >-
      The current, editable working state of a Workspace BOM, as opposed to a BOM release, which is a static
      snapshot of its data. It is the common base of Managed BOM and Consolidated BOM; in the BOM Portal, BOM
      releases are made from a Managed BOM's working state.
    structured_aliases:
      - literal_form: WIP BOM
        predicate: RELATED_SYNONYM
        contexts: [altium-365]
        source: https://www.altium.com/documentation/altium-365/bom-portal
    mixins:
      - pro_Bom
    slots:
      - core_releases
      - lib_uses_parts
      - lib_uses_components
    slot_usage:
      core_releases:
        range: pro_BomRelease
      
  pro_ManagedBOM:
    is_a: pro_BomWIP
    in_subset: procurement
    class_uri: pro:ManagedBOM
    title: Managed BOM
    description: >-
      A bill of materials kept in a Workspace and worked on in the BOM Portal, where its lines are enriched with
      manufacturer and supplier data for review and procurement. It can be created from a design project (one of its
      variants or releases) or uploaded as a CSV/XLS file from any source. A Managed BOM made from a project keeps a
      link to that project, so it can be updated when the project changes, either in place or as a new revision;
      snapshots of its data at a point in time are kept as BOM releases.
    comments:
      - Managed BOM has its own identity and lifecycle, separate from any design project it is created from (though
        linked to it), and serves as the authoritative reference for procurement, manufacturing, and compliance processes. It
        supports traceability, repeatability, and governance by recording sourcing decisions and alternates and capturing
        them in BOM releases, while enabling collaboration between engineering, supply chain, and manufacturing teams
        within the Altium 365 environment.
    annotations:
      grid: grid:workspace:{workspace-id}:procurement:bom/{id}
      platformAPI: BomWip
    see_also:
      - https://www.altium.com/documentation/altium-365/bom-portal
      - https://www.altium.com/documentation/altium-365/workspace-projects#uploading_or_creating_a_managed_bom

  pro_ConsolidatedBOM:
    is_a: pro_BomWIP
    in_subset: procurement
    class_uri: pro:ConsolidatedBOM
    title: Consolidated BOM
    description: >- 
      Consolidated BOM represents the aggregated bill of materials across one or more Projects or variants, combining all required 
      Parts into a single, unified view for procurement and manufacturing.       
    comments:
      - Consolidated BOM provides a supply-chain–ready artifact with its own identity and lifecycle, ensuring traceability back 
        to the originating designs while normalizing duplicates, alternates, and quantity rollups. It acts as the bridge between 
        engineering output and enterprise procurement systems, enabling efficient sourcing, cost analysis, and lifecycle validation 
        across multiple boards or product configurations within the Altium 365 ecosystem.
    aliases:
      - Order BOM
    annotations:
      grid: grid:workspace:{workspace-id}:procurement:bom/{id}
      platformAPI: BomWip
    see_also:
      - https://www.altium.com/documentation/altium-365/bom-portal/consolidated-bom

  pro_GlobalBOM:
    is_a: core_Activity
    in_subset: procurement
    class_uri: pro:GlobalBOM
    title: Global BOM
    description: >-
      Global BOM represents a bill of materials that resides outside of any workspace, on Octopart, where users
      can create, edit, collaborate on and share it with others.
    comments:
      - Global BOM follows the same conceptual BOM model as workspace-scoped BOMs (items, alternates, substitutes
        and issues), but its identity and access are not bound to a workspace. This mirrors other entities that
        can exist both workspace-scoped and globally (e.g. workspace Hardware Projects vs. personal, shareable projects).
      - Global BOM does not produce releases yet, hence it does not specialise BOM WIP and has no releases relation.
      - Global BOM has no access to workspace libraries, so it references supply Parts only. Its item elements resolve
        to supply Parts; the workspace component reference is not used.
    annotations:
      grid: grid:global::procurement:bom/{id}
      productDocs: none
    mixins:
      - pro_Bom
    attributes:
      pro_GlobalBOM_usesParts:
        is_a: core_hasInput
        slot_uri: pro:GlobalBOM_usesParts
        alias: usesParts
        title: parts
        description: Supply Parts used in this Global BOM.
        domain: pro_GlobalBOM
        range: sup_Part
        required: false
        multivalued: true

  pro_BomRelease:
    is_a: core_Artifact
    in_subset: procurement
    class_uri: pro:BomRelease
    title: BOM Release
    description: >-
      A static snapshot of a Managed BOM's data, saved under a release name with an incremented revision number and
      optional notes. The BOM Portal makes a release automatically when a Managed BOM is first created and again once
      its data has been mapped, and further releases can be made whenever needed. Each release moves through its own
      lifecycle states (by default Draft, Approved and Obsolete), and a Workspace can be configured to block releasing
      while the BOM has Error or Fatal Error issues.
    annotations:
      grid: grid:workspace:{workspace-id}:procurement:bom-release/{id}
      platformAPI: BomRelease
    see_also:
      - https://www.altium.com/documentation/altium-365/bom-portal#release_naming
    mixins:
      - pro_Bom
      - plt_HasLifecycle
    slots:
      - lib_consists_of_parts
      - lib_consists_of_components

  ### Resources

  pro_BomItem:
    is_a: core_Resource
    in_subset: procurement
    class_uri: pro:BomItem
    title: BOM Item
    description: >-
      One line of a BOM: its designators and quantity, the primary manufacturer part used for it (identified by
      manufacturer and manufacturer part number), and any alternate parts recorded for that line. A line can be linked
      to a Workspace component that lists its part among its Part Choices, and BOM checks report issues against
      individual lines.
    annotations:
      platformAPI: BomItem
    see_also:
      - https://www.altium.com/documentation/altium-365/bom-portal/configuration-options#bom-structure-features
    structured_aliases:
      - literal_form: BOM line
        predicate: EXACT_SYNONYM
        contexts: [altium-365]
        source: https://www.altium.com/documentation/altium-365/bom-portal/configuration-options
    attributes:
      pro_BomItem_designators:
        alias: designators
        slot_uri: pro:BomItem_designators
        title: designators
        description: A list of designators that specify the placements of the item within the schematic.
        range: string
        multivalued: true
        required: false
      pro_BomItem_quantity:
        alias: quantity
        slot_uri: pro:BomItem_quantity
        title: quantity
        description: The quantity of the item required to produce one unit.
        range: integer
        multivalued: false
        required: true
      pro_BomItem_primaryElement:
        alias: primaryElement
        slot_uri: pro:BomItem_primaryElement
        title: primary element
        description: The primary element chosen for this item.
        range: pro_BomItemElement
        multivalued: false
        required: false   
      pro_BomItem_alternates:
        alias: alternates
        slot_uri: pro:BomItem_alternates
        title: alternates
        description: Alternate elements that could be used for this item.
        range: pro_BomItemAlternate
        required: false
        multivalued: true
      pro_BomItem_substitutes:
        alias: substitutes
        slot_uri: pro:BomItem_substitutes
        title: substitutes
        description: Substitute elements that could be used for this item.
        range: pro_BomItemSubstitute
        required: false
        multivalued: true
    slots:
      - pro_bom_issues
    slot_usage:
      pro_bom_issues:
        description: Issues associated with this BOM item.

  pro_BomItemElement:
    is_a: core_Resource
    in_subset: procurement
    class_uri: pro:BomItemElement
    abstract: true
    title: BOM Item Element
    description: An element (part) that might be used for a particular BOM item.
    annotations:
      platformAPI: BomItemElement
    see_also:
      - https://www.altium.com/documentation/altium-365/bom-portal/workspace-components-integration
    attributes:
      pro_BomItemElement_mpn:
        alias: mpn
        slot_uri: pro:BomItemElement_mpn
        title: mpn
        description: TBD
        range: string
        required: false
        multivalued: false
      pro_BomItemElement_manufacturer:
        alias: manufacturer
        slot_uri: pro:BomItemElement_manufacturer
        title: manufacturer
        description: TBD
        range: string
        required: false
        multivalued: false
      pro_BomItemElement_part:
        alias: part
        slot_uri: pro:BomItemElement_part
        title: part
        description: >-
          The Part this element resolves to - a workspace library Part for workspace BOMs, or a supply Part
          for BOMs that live outside a workspace (e.g. Global BOM).
        range: Any
        any_of:
          - range: lib_Part
          - range: sup_Part
        required: false
        multivalued: false
      pro_BomItemElement_component:
        alias: component
        slot_uri: pro:BomItemElement_component
        title: component
        description: TBD
        range: lib_ComponentRevision
        required: false
        multivalued: false

    slots:
      # reusing common slot 
      - pro_bom_issues

  pro_BomItemAlternate:
    is_a: pro_BomItemElement
    in_subset: procurement
    class_uri: pro:BomItemAlternate
    title: BOM Item Alternate
    description: >-
      An alternate part recorded for one BOM line: another manufacturer part that could be used instead of the line's
      primary part. Alternates belong to the individual BOM line rather than applying across BOMs. They can come from
      an uploaded BOM file, be added by hand, or be filled in automatically from the linked component's Part Choices
      and from suggested alternates, and an alternate can be promoted to become the line's primary part.
    annotations:
      platformAPI: BomItemAlternate
    see_also:
      - https://www.altium.com/documentation/altium-365/bom-portal/configuration-options#add_alternate
    structured_aliases:
      - literal_form: Alternate
        predicate: EXACT_SYNONYM
        contexts: [altium-365]
        source: https://www.altium.com/documentation/altium-365/bom-portal/configuration-options

  pro_BomItemSubstitute:
    is_a: pro_BomItemElement
    in_subset: procurement
    class_uri: pro:BomItemSubstitute
    title: BOM Item Substitute
    description: Substitute is a replacement of a part by another within an individual BOM.
    annotations:
      platformAPI: BomItemSubstitute

  pro_BomIssue:
    is_a: core_Resource
    in_subset: procurement
    class_uri: pro:BomIssue
    title: BOM Issue
    description: >-
      A problem found when a BOM is analysed, usually against a particular BOM line: for example an unknown part
      number, a duplicated designator, or a part that is deprecated, low in stock or not compliant with a standard such
      as REACH. The level at which each kind of check reports (Fatal Error, Error or Warning, or No Report to ignore
      it) is configurable, and an individual issue can be waived.
    annotations:
      platformAPI: BomIssue
    see_also:
      - https://www.altium.com/documentation/altium-365/bom-portal/error-detection-correction
    attributes:
      pro_BomIssue_description:
        alias: description
        slot_uri: pro:BomIssue_description
        title: description
        description: TBD
        range: string
        required: false
        multivalued: false
      pro_BomIssue_howToFix:
        alias: howToFix
        slot_uri: pro:BomIssue_howToFix
        title: how to fix
        description: TBD
        range: string
        required: false
        multivalued: false
      pro_BomIssue_severity:
        alias: severity
        slot_uri: pro:BomIssue_severity
        title: severity
        description: TBD
        range: string # TBD
        required: false
        multivalued: false

slots:

  ### BOM relations

  pro_bom_issues:
    slot_uri: pro:issues
    alias: issues
    title: issues
    
    description: TBD
    range: pro_BomIssue
    required: false
    multivalued: true