id: https://w3id.org/altium/cdm/customization
name: cdm-customization

prefixes:
  linkml: https://w3id.org/linkml/
  cus: https://w3id.org/altium/cdm/customization/

imports:
  - linkml:types

default_range: string
default_prefix: cus

subsets:
  customization:
    description: >-
      TBD
    annotations:
      style: "fill:#a2c4c9"

classes:

  cus_Script:
    is_a: core_Artifact
    in_subset: customization
    class_uri: cus:Script
    title: Script
    description: TBD
    annotations:
      grid: grid:workspace:{workspace-id}:scripts:script/{id}
      platformAPI: GloScrScript
    slots:
      - core_revisions
    slot_usage:
      core_revisions:
        range: cus_ScriptVersion

  cus_ScriptVersion:
    is_a: core_Artifact
    in_subset: customization
    class_uri: cus:ScriptVersion
    title: Script Version
    description: TBD
    annotations:
      grid: grid:workspace:{workspace-id}:scripts:script-version/{id}
      platformAPI: GloScrScriptVersion
    attributes:
      cus_ScriptVersion_executions:
        alias: executions
        slot_uri: cus:ScriptVersion_executions
        title: executions
        description: Script executions produced by this script version.
        range: cus_ScriptExecution
        multivalued: true
        required: false

  cus_ScriptExecution:
    is_a: core_Artifact
    in_subset: customization
    class_uri: cus:ScriptExecution
    title: Script Execution
    description: TBD
    annotations:
      grid: grid:workspace:{workspace-id}:scripts:script-execution/{id}
      platformAPI: GloScrScriptExecution
    attributes:
      cus_ScriptExecution_emits:
        slot_uri: cus:ScriptExecution_emits
        alias: emits
        title: emits
        description: TBD
        range: Any
        multivalued: false
        required: false
        any_of:
          - range: cus_ScriptExecutionCompleted

  cus_Workflow:
    is_a: core_Activity
    in_subset: customization
    class_uri: cus:Workflow
    title: Workflow
    description: >-
      A process workflow of an Altium 365 Workspace: the workflow that belongs to a process definition and steps
      designers through an everyday design process (e.g. requesting a new part, a design review or creating a new
      project). Workspace administrators build process definitions in the Process Workflow Editor, grouped by
      process theme (Part Requests, Project Activities, Project Creations), and activate them; each started
      instance of a process follows the workflow and creates tasks for the users whose action is needed to move
      it on.
    annotations:
      grid: grid:workspace:{workspace-id}:customization:workflow/{id}
      platformAPI: DesWorkflowDefinition
    see_also:
      - https://www.altium.com/documentation/altium-365/processes-workflows
      - https://www.altium.com/documentation/altium-365/creating-managing-processes
      - https://www.altium.com/documentation/altium-365/defining-process-workflow
    structured_aliases:
      - literal_form: Process Workflow
        predicate: EXACT_SYNONYM
        contexts: [altium-365]
        source: https://www.altium.com/documentation/altium-365/processes-workflows
      - literal_form: Process Definition
        predicate: RELATED_SYNONYM
        contexts: [altium-365]
        source: https://www.altium.com/documentation/altium-365/creating-managing-processes

  cus_ScriptExecutionCompleted:
    is_a: core_Event
    in_subset: customization
    class_uri: cus:ScriptExecutionCompleted
    title: Script Execution Completed
    description: TBD

