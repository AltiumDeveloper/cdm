id: https://w3id.org/altium/cdm/configuration/
name: cdm-configuration

prefixes:
  linkml: https://w3id.org/linkml/
  con: https://w3id.org/altium/cdm/configuration/

imports:
  - linkml:types

default_range: string
default_prefix: con

subsets:
  configuration:
    title: Configuration Management
    description: >-
      Models environment configurations, which restrict the Altium Designer working environment of the
      Workspace members they target to approved configuration data, together with schematic templates and
      their revisions stored as Workspace Items. In Altium 365 this corresponds to environment configuration
      management through the Team Configuration Center.
    see_also:
      - https://www.altium.com/documentation/altium-365/environment-configuration-management
    annotations:
      style: "fill:#ead1dc"

classes:

  con_EnvironmentConfiguration:
    is_a: core_Artifact
    in_subset: configuration
    class_uri: con:EnvironmentConfiguration
    title: Environment Configuration
    description: >-
      A named set of configuration data items that the Workspace members it targets are allowed to use in
      Altium Designer. The items are revisions of Workspace Items of supported content types (e.g. schematic,
      BOM, project and Draftsman templates, output job files and layer stacks, plus at most one Altium Designer
      Preferences revision), and the same item can be used by several configurations. Administrators define
      configurations in the Workspace's Team Configuration Center (TC2) and assign them to Workspace groups,
      called roles there; when a group member signs in to the Workspace from Altium Designer, each controlled
      area of the design environment is restricted to the chosen configuration's items.
    comments:
      - TBD
    annotations:
      grid: 
    see_also:
      - https://www.altium.com/documentation/altium-365/environment-configuration-management
      - https://www.altium.com/documentation/altium-365/managing-environment-configurations
    attributes:
      con_EnvironmentConfiguration_schematicTemplates:
        is_a: core_hasPart
        slot_uri: con:EnvironmentConfiguration_schematicTemplates
        alias: schematicTemplates
        title: schematic templates
        description: TBD
        range: con_SchematicTemplateRevision
        multivalued: true
        annotations:
          modeled_as: Vault Item - Revision

  con_SchematicTemplate:
    is_a: core_Artifact
    in_subset: configuration
    class_uri: con:SchematicTemplate
    title: Schematic Template
    description: >-
      A schematic template stored as a Workspace Item. When applied to a schematic sheet, the template sets the
      sheet's size, its graphics such as a title block, and its sheet-level parameters, so that a team's
      schematics look consistent. The template content is kept in successive revisions of the Item, and
      environment configurations can reference those revisions to control which templates designers may use.
    comments:
      - TBD
    annotations:
      grid: 
    see_also:
      - https://www.altium.com/documentation/altium-designer/schematic/creating-templates
    slots:
      - core_revisions
    slot_usage:
      core_revisions:
        range: con_SchematicTemplateRevision

  con_SchematicTemplateRevision:
    is_a: core_Artifact
    in_subset: configuration
    class_uri: con:SchematicTemplateRevision
    title: Schematic Template Revision
    description: >-
      One revision of a Workspace schematic template Item, holding the template as saved at that point, e.g.
      from Altium Designer with Save to Server or uploaded from a *.SchDot file. Editing the template saves the
      result into the next revision, and environment configurations list template revisions, rather than the
      Item itself, as their configuration data.
    comments:
      - TBD
    annotations:
      grid:  
    see_also:
      - https://www.altium.com/documentation/altium-designer/schematic/creating-templates#creating_workspace_schematic_template
