id: https://w3id.org/altium/cdm/deviceModel/
name: cdm-device-model
prefixes:
  linkml: https://w3id.org/linkml/
  dm: https://w3id.org/altium/cdm/deviceModel/

imports:
  - linkml:types

default_range: string
default_prefix: dm

subsets:
  deviceModel:
    description: >-
      Provides a comprehensive representation of embedded hardware, including peripherals, 
      pin multiplexing, and memory maps. This subset defines the constraints necessary 
      to model valid hardware configurations and perform feasibility analysis—ensuring 
      a device's physical resources can satisfy specific application use-cases.
    annotations:
      style: "fill:#6fa8dc"

enums:
  dm_Endianness:
    is_a: Enumeration
    in_subset: deviceModel
    enum_uri: dm:Endianness
    description: >-
      Specifies the byte-ordering convention of the processor. 
      Bi-endian indicates the hardware can be configured for either mode.
    implements:
      - owl:NamedIndividual
    permissible_values:
      LittleEndian:
        title: "Little-endian"
        description: Least significant byte is stored at the lowest address.
      BigEndian:
        title: "Big-endian"
        description: Most significant byte is stored at the lowest address.
      BiEndian:
        title: "Bi-endian"
        description: Processor supports switching between little and big endian modes.
  dm_AddressBlockType:
    is_a: Enumeration
    in_subset: deviceModel
    enum_uri: dm:AddressBlockType
    description: >-
      Specifies the type of address block within the device's memory map.
    implements:
      - owl:NamedIndividual
    permissible_values:
      Memory:
        title: "Memory"
        description: Address block represents a memory region (e.g., RAM, Flash).
      Peripheral:
        title: "Peripheral"
        description: Address block represents a peripheral device (e.g., UART, GPIO).
  dm_AccessType:
    is_a: Enumeration
    in_subset: deviceModel
    enum_uri: dm:AccessType
    description: >-
      Specifies the access permissions for a register or memory region.
    implements:
      - owl:NamedIndividual
    permissible_values:
      ReadOnly:
        title: "Read-Only"
        description: The register or memory region can only be read.
      WriteOnly:
        title: "Write-Only"
        description: The register or memory region can only be written to.
      ReadWrite:
        title: "Read-Write"
        description: The register or memory region can be both read from and written to.
  dm_PortMode:
    is_a: Enumeration
    in_subset: deviceModel
    enum_uri: dm:PortMode
    description: >-
      Defines the primary operational mode of a physical port pin. 
      Determines if the pin is controlled by the GPIO controller or 
      routed to a specific peripheral function.
    implements:
      - owl:NamedIndividual
    permissible_values:
      Gpio:
        description: Pin is configured as General Purpose Input/Output.
      AlternateFunction:
        description: Pin is routed to a specific peripheral internal signal (e.g., UART TX, SPI CLK).
  dm_GpioMode:
    is_a: Enumeration
    in_subset: deviceModel
    enum_uri: dm:GpioMode
    description: >-
      Defines the specific electrical and logical configuration of a pin 
      when PortMode is set to Gpio.
    permissible_values:
      None:
        description: No specific GPIO mode assigned (often used for high-impedance or initial state).
      Input:
        description: Pin is configured as a digital input.
      OutputLow:
        description: Pin is configured as a digital output with a default logic low (0) state.
      OutputHigh:
        description: Pin is configured as a digital output with a default logic high (1) state.
  dm_PeripheralVirtualization:
    is_a: Enumeration
    in_subset: deviceModel
    enum_uri: dm:PeripheralVirtualization
    description: >-
      Defines the virtualization model used by a peripheral interface, describing
      whether the peripheral is implemented as a single, non-virtualized instance
      or as multiple virtualized instances mapped to individual functional
      channels.
    permissible_values:
      None:
        description: >-
          No virtualization. All associated functions collectively implement a
          single peripheral interface instance (for example, SCI0 on RA devices).
      Channel:
        description: >-
          Channel-based virtualization. Each individual function represents an
          independent channel and implements the peripheral interface type
          separately (for example, ADC on RA devices where each ANxxx function
          corresponds to an ADC channel).


classes:
  dm_HasAddressRange:
    is_a: core_Meta
    abstract: true
    mixin: true
    class_uri: dm:HasAddressRange
    description: >-
      A mixin for entities that occupy a specific span of the memory map. 
      It provides the foundational properties required for addressing and 
      size-based feasibility checks.
    attributes:
      dm_HasAddressRange_startAddress:
        slot_uri: dm:HasAddressRange_startAddress
        alias: startAddress
        title: start address
        identifier: true
        description: The base physical address of the memory region.
        range: integer
      dm_HasAddressRange_size:
        slot_uri: dm:HasAddressRange_size
        alias: size
        title: size
        description: The total span of the memory region in bytes.
        range: integer

  dm_ConfiguredDeviceModel:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:ConfiguredDeviceModel
    title: ConfiguredDeviceModel
    description: >-
      A digital twin of an embedded hardware device as configured for a specific use-case.
      It exposes the device model filtered to specific device configuration.
    annotations:
      platformAPI: DmConfiguredDeviceModel
    slots:
      - core_localId
      - dm_boardName
      - dm_mpn
      - dm_peripherals
      - dm_ports

  dm_FullStackDeviceModel:
    is_a: core_Artifact
    in_subset: deviceModel
    class_uri: dm:FullStackDeviceModel
    title: FullStackDeviceModel
    description: >-
      A digital twin of an embedded hardware device. It exposes the full device model,
      including interfaces, peripherals, and ports.
    annotations:
      grid: grid:global::device-model:fullstack-dm/{id}
      platformAPI: DmFullStackDeviceModel
    slots:
      - dm_mpn
      - dm_peripherals
      - dm_ports
    attributes:
      dm_FullStackDeviceModel_family:
        slot_uri: dm:FullStackDeviceModel_family
        alias: family
        title: device family
        description: The family to which the device belongs.
        range: string
        required: true
      dm_FullStackDeviceModel_processors:
        slot_uri: dm:FullStackDeviceModel_processors
        alias: processors
        title: processors
        description: List of processors included in the device.
        range: dm_Processor
        multivalued: true
        inlined: true
        inlined_as_list: true
      dm_FullStackDeviceModel_addressMap:
        slot_uri: dm:FullStackDeviceModel_addressMap
        alias: addressMap
        title: address map
        description: The hardware address map configuration.
        range: dm_AddressMap

  dm_Processor:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:Processor
    title: Processor
    description: >-
      Represents a physical processing core. Defining endianness and clock 
      frequency allows the system to determine if the hardware can meet 
      the computational and data-ordering requirements of a use-case.
    annotations:
      platformAPI: DmProcessor
    attributes:
      dm_Processor_name:
        slot_uri: dm:Processor_name
        alias: name
        title: name
        description: The unique identifier for this processor instance.
        range: string
        required: true
      dm_Processor_core:
        slot_uri: dm:Processor_core
        alias: core
        title: core
        description: Architectural core type (e.g., Cortex-M4).
        range: string
        required: true
      dm_Processor_endian:
        slot_uri: dm:Processor_endian
        alias: endian
        title: endian
        description: >-
          The byte-ordering capability of the core. If Bi-endian, 
          the device is considered compatible with both LE and BE use-cases.
        range: dm_Endianness
        required: true
      dm_Processor_clock:
        slot_uri: dm:Processor_clock
        alias: clock
        title: clock
        description: The operating frequency in Hz.
        range: integer
        required: true

  dm_AddressMap:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:AddressMap
    title: AddressMap
    description: Address map for the device including memory and peripheral regions.
    annotations:
      platformAPI: DmAddressMap
    attributes:
      dm_AddressMapModel_segments:
        slot_uri: dm:AddressMap_segments
        alias: segments
        title: segments
        description: >-
          A collection of memory segments defined within the device's address space. 
          Each entry describes a specific block of memory.
        range: dm_AddressSegment
        multivalued: true
        inlined: true
        inlined_as_list: true

  dm_AddressSegment:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:AddressSegment
    title: AddressSegment
    description: >-
      A contiguous region of the device's memory map. Each segment can represent either 
      a memory or a peripheral region.
    annotations:
      platformAPI: DmAddressSegment
    mixins:
      - dm_HasAddressRange
    slots:
      - core_description
    attributes:
      dm_AddressSegment_name:
        slot_uri: dm:AddressSegment_name
        alias: name
        title: name
        description: The name of the address segment.
        range: string
      dm_AddressSegment_aliases:
        slot_uri: dm:AddressSegment_aliases
        alias: aliases
        title: aliases
        description: Alternative names for the segment.
        range: string
        multivalued: true
      dm_AddressSegment_blocks:
        slot_uri: dm:AddressSegment_blocks
        alias: blocks
        title: blocks
        description: The nested address blocks within the segment
        range: dm_AddressBlock
        multivalued: true
        inlined: true
        inlined_as_list: true
      dm_AddressSegment_peripherals:
        slot_uri: dm:AddressSegment_peripherals
        alias: peripherals
        title: peripherals
        description: The peripherals associated with this segment.
        range: dm_Peripheral
        multivalued: true
        inlined: false

  dm_AddressBlock:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:AddressBlock
    title: AddressBlock
    description: Address block with start, size, and optional registers and peripherals.
    annotations:
      platformAPI: DmAddressBlock
    mixins:
      - dm_HasAddressRange
    slots:
      - core_description
    attributes:
      dm_AddressBlock_name:
        slot_uri: dm:AddressBlock_name
        alias: name
        title: name
        description: The name of the address block.
        range: string
      dm_AddressBlock_type:
        slot_uri: dm:AddressBlock_type
        alias: type
        title: type
        description: The type of the address block.
        range: dm_AddressBlockType
      dm_AddressBlock_memories:
        slot_uri: dm:AddressBlock_memories
        alias: memories
        title: memories
        description: List of memory entries associated with this block.
        range: dm_Memory
        multivalued: true
      dm_AddressBlock_registers:
        slot_uri: dm:AddressBlock_registers
        alias: registers
        title: registers
        description: List of registers contained within this address block.
        range: dm_Register
        multivalued: true
        inlined: true
        inlined_as_list: true
      dm_AddressBlock_peripheralInstance:
        slot_uri: dm:AddressBlock_peripheralInstance
        alias: peripheralInstance
        title: peripheral instance
        description: A peripheral instance associated with this address block.
        range: dm_PeripheralInstance
        required: false
        inlined: false

  dm_Memory:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:Memory
    title: Memory
    description: A memory entry within an address block.
    annotations:
      platformAPI: DmMemory
    attributes:
      dm_Memory_name:
        slot_uri: dm:Memory_name
        alias: name
        title: name
        description: The name of the memory entry.
        range: string
      dm_Memory_type:
        slot_uri: dm:Memory_type
        alias: type
        title: type
        description: The type of memory entry.
        range: string
      dm_Memory_size:
        slot_uri: dm:Memory_size
        alias: size
        title: size
        description: The total span of the memory region in bytes.
        range: integer

  dm_Register:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:Register
    title: Register
    description: A hardware register within an address block.
    annotations:
      platformAPI: DmRegister
    mixins:
      - dm_HasAddressRange
    slots:
      - core_description
    attributes:
      dm_Register_name:
        slot_uri: dm:Register_name
        alias: name
        title: name
        description: The name of the register.
        range: string
      dm_Register_access:
        slot_uri: dm:Register_access
        alias: access
        title: access
        description: The access type of the register.
        range: dm_AccessType
      dm_Register_resetValue:
        slot_uri: dm:Register_resetValue
        alias: resetValue
        title: resetValue
        description: The value to reset the register.
        range: string
      dm_Register_resetMask:
        slot_uri: dm:Register_resetMask
        alias: resetMask
        title: resetMask
        description: The mask applied during register reset.
        range: string
      dm_Register_fields:
        slot_uri: dm:Register_fields
        alias: fields
        title: fields
        description: Bit fields within this register.
        range: dm_RegisterField
        multivalued: true
        inlined: true
        inlined_as_list: true

  dm_RegisterField:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:RegisterField
    title: RegisterField
    description: A bit field within a register.
    annotations:
      platformAPI: DmRegisterField
    slots:
      - core_description
    attributes:
      dm_RegisterField_name:
        slot_uri: dm:RegisterField_name
        alias: name
        title: name
        description: The name of the register field.
        range: string
      dm_RegisterField_lsb:
        slot_uri: dm:RegisterField_lsb
        alias: lsb
        title: lsb
        description: The least significant bit position of the field.
        range: integer
      dm_RegisterField_msb:
        slot_uri: dm:RegisterField_msb
        alias: msb
        title: msb
        description: The most significant bit position of the field.
        range: integer
      dm_RegisterField_access:
        slot_uri: dm:RegisterField_access
        alias: access
        title: access
        description: The access type of the register field.
        range: dm_AccessType
      dm_RegisterField_enums:
        slot_uri: dm:RegisterField_enums
        alias: enums
        title: enums
        description: Enumerated values for the register field.
        range: dm_FieldEnum
        multivalued: true
        inlined: true
        inlined_as_list: true

  dm_FieldEnum:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:FieldEnum
    title: FieldEnum
    description: An enumerated value for a register field.
    annotations:
      platformAPI: DmFieldEnum
    slots:
      - core_description
    attributes:
      dm_FieldEnum_name:
        slot_uri: dm:FieldEnum_name
        alias: name
        title: name
        description: The name of the enumerated value.
        range: string
      dm_FieldEnum_value:
        slot_uri: dm:FieldEnum_value
        alias: value
        title: value
        description: The actual value of the enumeration.
        range: string

  dm_Peripheral:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:Peripheral
    title: Peripheral
    description: A single peripheral definition, including its instances and properties.
    annotations:
      platformAPI: DmPeripheral
    slots:
      - core_localId
    attributes:
      dm_Peripheral_name:
        slot_uri: dm:Peripheral_name
        alias: name
        title: name
        description: The name of the peripheral.
        range: string
      dm_Peripheral_instances:
        slot_uri: dm:Peripheral_instances
        alias: instances
        title: instances
        description: The list of instances of this peripheral present on the device.
        range: dm_PeripheralInstance
        multivalued: true
        inlined: true
        inlined_as_list: true

  dm_PeripheralInstance:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:PeripheralInstance
    title: PeripheralInstance
    description: A concrete instance of a peripheral (e.g., SCI0), including available modes.
    annotations:
      platformAPI: DmPeripheralInstance
    slots:
      - core_localId
    attributes:
      dm_PeripheralInstance_name:
        slot_uri: dm:PeripheralInstance_name
        alias: name
        title: name
        description: The name of the peripheral instance.
        range: string
      dm_PeripheralInstance_unit:
        slot_uri: dm:PeripheralInstance_unit
        alias: unit
        title: unit
        description: The specific hardware unit index for the peripheral instance.
        range: string
      dm_PeripheralInstance_modes:
        slot_uri: dm:PeripheralInstance_modes
        alias: modes
        title: modes
        description: The list of modes this peripheral instance can fulfill (e.g., Asynchronous UART).
        range: dm_PeripheralMode
        multivalued: true
        inlined: true
        inlined_as_list: true
      dm_PeripheralInstance_interfaceType:
        slot_uri: dm:PeripheralInstance_interfaceType
        alias: interfaceType
        title: interfaceType
        description: The generic interface this peripheral instance is configured as.
        range: string
      dm_PeripheralInstance_virtualization:
        slot_uri: dm:PeripheralInstance_virtualization
        alias: virtualization
        title: virtualization
        description: >-
          Specifies how this peripheral instance is virtualized, indicating whether
          the instance represents a single, non-virtualized peripheral or a
          channel-virtualized peripheral where individual functions act as separate
          interface instances.
        range: dm_PeripheralVirtualization

  dm_PeripheralMode:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:PeripheralMode
    title: PeripheralMode
    description: A specific mode that a peripheral instance can fulfill,
    annotations:
      platformAPI: DmPeripheralMode
    attributes:
      dm_PeripheralMode_name:
        slot_uri: dm:PeripheralMode_name
        alias: name
        title: name
        description: Name of the peripheral mode (e.g., Asynchronous UART).
        range: string
      dm_PeripheralMode_configurations:
        slot_uri: dm:PeripheralMode_configurations
        alias: configurations
        title: configurations
        description: The configurations available within this peripheral modes.
        range: dm_PeripheralConfiguration
        multivalued: true
        inlined: true
        inlined_as_list: true

  dm_PeripheralConfiguration:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:PeripheralConfiguration
    title: PeripheralConfiguration
    description: A concrete configuration for a peripheral role, containing pin multiplexing details.
    annotations:
      platformAPI: DmPeripheralConfiguration
    slots:
      - core_localId
    attributes:
      dm_PeripheralConfiguration_parameters:
        slot_uri: dm:PeripheralConfiguration_parameters
        alias: parameters
        title: parameters
        description: The list of parameters associated with this peripheral configuration.
        range: dm_PeripheralParameter
        multivalued: true
        inlined: true
        inlined_as_list: true
      dm_PeripheralConfiguration_pinConfigs:
        slot_uri: dm:PeripheralConfiguration_pinConfigs
        alias: pinConfigs
        title: pinConfigs
        description: The list of pin function to port mappings for this configuration.
        range: dm_PeripheralPinConfig
        multivalued: true
        inlined: true
        inlined_as_list: true
      dm_PeripheralConfiguration_pinDependencyConfigs:
        slot_uri: dm:PeripheralConfiguration_pinDependencyConfigs
        alias: pinDependencyConfigs
        title: pinDependencyConfigs
        description: The list of alternative pin configurations that must be applied together with this configuration.
        range: dm_PeripheralPinDependencyConfig
        multivalued: true
        inlined: true
        inlined_as_list: true

  dm_PeripheralPinConfig:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:PeripheralPinConfig
    title: PeripheralPinConfig
    description: A specific pin multiplexing configuration within peripheral configuration.
    annotations:
      platformAPI: DmPeripheralPinConfig
    attributes:
      dm_PinConfig_pinName:
        slot_uri: dm:PeripheralPinConfig_pinName
        alias: pinName
        title: pin name
        description: The fully qualified identifier representing the channel, and pin function (e.g., sci0.txt, iic1.scl).
        range: string
      dm_PinConfig_pinValue:
        slot_uri: dm:PeripheralPinConfig_pinValue
        alias: pinValue
        title: pin value
        description: The fully qualified identifier representing the channel, pin function, and physical pin (e.g., sci0.txd.p101, iic1.scl.p402).
        range: string
      dm_PinConfig_function:
        slot_uri: dm:PeripheralPinConfig_function
        alias: function
        title: function
        description: The logical pin function name (e.g., TXD, RXD).
        range: string
      dm_PinConfig_port:
        slot_uri: dm:PeripheralPinConfig_port
        alias: port
        title: port
        description: The physical port target for the pin function.
        range: string
      dm_PinConfig_portName:
        slot_uri: dm:PeripheralPinConfig_portName
        alias: portName
        title: port name
        description: The physical port mapping target for the pin function.
        range: string
      dm_PinConfig_channel:
        slot_uri: dm:PeripheralPinConfig_channel
        alias: channel
        title: channel
        description: >-
          Identifies the specific virtualized channel used by this pin configuration.
          This field is applicable only when the associated peripheral instance uses
          channel-based virtualization and must uniquely identify the peripheral
          instance and function combination (for example, "adc0.an100"). Not all
          functions or signals associated with a peripheral instance necessarily
          implement the peripheral interface itself; auxiliary signals such as trigger
          or control inputs (for example, ADC external trigger inputs like ADTRG0)
          do not require a channel designation.
        range: string

  dm_PeripheralPinDependencyConfig:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:PeripheralPinDependencyConfig
    title: PeripheralPinDependencyConfig
    description: A pin dependency to port mapping entry within peripheral configuration.
    annotations:
      platformAPI: DmPeripheralPinDependencyConfig
    attributes:
      dm_PinDependencyConfig_name:
        slot_uri: dm:PeripheralPinDependencyConfig_name
        alias: name
        title: name
        description: The name of the pin dependency configuration.
        range: string
      dm_PinDependencyConfig_value:
        slot_uri: dm:PeripheralPinDependencyConfig_value
        alias: value
        title: value
        description: The value of the pin dependency configuration.
        range: string

  dm_PeripheralParameter:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:PeripheralParameter
    title: PeripheralParameter
    description: A paramter associated with peripheral instance configuration.
    annotations:
      platformAPI: DmPeripheralParameters
    attributes:
      dm_PeripheralParameters_name:
        slot_uri: dm:PeripheralParameter_name
        alias: name
        title: name
        description: The name of the peripheral parameter.
        range: string
        required: true
        identifier: true
      dm_PeripheralParameters_value:
        slot_uri: dm:PeripheralParameter_value
        alias: value
        title: value
        description: The value of the peripheral parameter.
        range: string
        required: true

  dm_Port:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:Port
    title: Port
    description: A physical port on the device, with its functions, configurations, and connections.
    annotations:
      platformAPI: DmPort
    slots:
      - core_localId
      - core_description
    attributes:
      dm_Port_name:
        slot_uri: dm:Port_name
        alias: name
        title: name
        description: The name of the port.
        range: string
      dm_Port_symbolicName:
        slot_uri: dm:Port_symbolicName
        alias: symbolicName
        title: symbolicName
        description: A symbolic name for the port used in code or configuration.
        range: string
      dm_Port_pin:
        slot_uri: dm:Port_pin
        alias: pin
        title: pin
        description: The physical pin associated with this port.
        range: dm_Pin
      dm_Port_functions:
        slot_uri: dm:Port_functions
        alias: functions
        title: functions
        description: The list of functions that this port can perform.
        range: dm_PortFunction
        multivalued: true
        inlined: true
        inlined_as_list: true
      dm_Port_configurations:
        slot_uri: dm:Port_configurations
        alias: configurations
        title: configurations
        description: The list of configurations available for this port.
        range: dm_PortConfiguration
        multivalued: true
        inlined: true
        inlined_as_list: true
      dm_Port_connections:
        slot_uri: dm:Port_connections
        alias: connections
        title: connections
        description: The list of connections associated with this port to other components or signals.
        range: dm_PortConnection
        multivalued: true
        inlined: true
        inlined_as_list: true

  dm_Pin:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:Pin
    title: Pin
    description: A physical pin on the device.
    annotations:
      platformAPI: DmPin
    attributes:
      dm_Pin_name:
        slot_uri: dm:Pin_name
        alias: name
        title: name
        description: The name of the pin.
        range: string
        identifier: true

  dm_PortFunction:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:PortFunction
    title: PortFunction
    description: A specific function that a port can perform.
    annotations:
      platformAPI: DmPortFunction
    attributes:
      dm_PortFunction_name:
        slot_uri: dm:PortFunction_name
        alias: name
        title: name
        description: The name of the port function.
        range: string
      dm_PortFunction_peripheralInstance:
        slot_uri: dm:PortFunction_peripheralInstance
        alias: peripheralInstance
        title: peripheral instance
        description: The peripheral instance associated with this port function.
        range: dm_PeripheralInstance
        inlined: false

  dm_PortConfiguration:
    is_a: core_Resource
    in_subset: deviceModel
    class_uri: dm:PortConfiguration
    title: PortConfiguration
    description: A specific configuration for a port.
    annotations:
      platformAPI: DmPortConfiguration
    slots:
      - core_localId
    attributes:
      dm_PortConfiguration_name:
        slot_uri: dm:PortConfiguration_name
        alias: name
        title: name
        description: The name of the port configuration.
        range: string
      dm_PortConfiguration_enumValues:
        slot_uri: dm:PortConfiguration_enumValues
        alias: enumValues
        title: enum values
        description: The possible values that can be associated with this port configuration.
        range: dm_PortConfigurationEnumValue
