name: PR checks
on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Lint schema (linkml-lint + cdm-lint incl. DOC rules)
        run: make lint

      - name: Tooling and template tests
        run: poetry run python -m pytest tests/cdm_tools -v
